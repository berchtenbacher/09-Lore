<script>
(() => {
  "use strict";

  // ---------- Konfiguration ----------
  // Kartenstile in Reihenfolge: der erste, der lädt, gewinnt. Beide basieren auf OpenStreetMap-Daten.
  const STYLE_SETS = [
    { name: "OpenFreeMap", light: "https://tiles.openfreemap.org/styles/positron", dark: "https://tiles.openfreemap.org/styles/dark" },
    { name: "CARTO", light: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json", dark: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json" },
  ];
  let styleSet = 0;
  const STYLES = { get light() { return STYLE_SETS[styleSet].light; }, get dark() { return STYLE_SETS[styleSet].dark; } };
  // Orte mit eigener Datendatei. Neue Orte: Datei unter data/ anlegen und hier eintragen.
  const REGIONS = [
    { id: "berlin", name: "Berlin", file: "data/berlin.geojson", center: [13.3990, 52.5150], zoom: 12.4, radiusKm: 35, districtLabel: "Bezirk" },
    { id: "frankfurt", name: "Frankfurt und Umgebung", file: "data/frankfurt.geojson", areas: "data/frankfurt-stadtteile.geojson", center: [8.6821, 50.1106], zoom: 13.2, radiusKm: 30, districtLabel: "Stadtteil" },
  ];
  let regions = REGIONS;
  const regionById = (id) => regions.find((r) => r.id === id) || regions[0];
  const IMPORTANCE = { 3: "Touri 1x1", 2: "Sehenswürdigkeit", 1: "Lokal" };
  // Ab welchem Zoom eine Stufe erscheint (je Stadt in REGIONS als minZoom überschreibbar). Steht alles auf 0,
  // regelt allein die Überlappung die Dichte: im vollen Zentrum gewinnen die wichtigen Orte, in dünn besetzten
  // Gegenden erscheinen auch lokale Punkte schon weit draußen. Wird es mit mehr Daten zu voll, hier Schwellen setzen,
  // z. B. { 3: 0, 2: 11, 1: 12 }. Beschriftung: Namen stehen erst ab LABEL_ZOOM fest neben dem Punkt (Stufe 3 = Touri 1x1,
  // Vorgeschlagen, Gemerkt). Mit Maus steht nur Stufe 3 fest, der Rest erscheint beim Darüberfahren; auf Touch-Geräten
  // gelten alle drei Werte. Weiter draußen sieht man nur Punkte, damit die Karte nicht wie ein Standard-Reiseführer wirkt.
  const MIN_ZOOM = { 3: 0, 2: 0, 1: 0 };
  const LABEL_ZOOM = { 3: 14, 2: 14, 1: 15.3 };
  const canHover = window.matchMedia && matchMedia("(hover: hover) and (pointer: fine)").matches;
  // Weit herausgezoomt: nur eine Handvoll zufälliger Wahrzeichen statt Zählblasen.
  const FAR_ZOOM = 10, FAR_MAX = 4;
  const TAGS_VISIBLE = 12;

  // ---------- Hilfen ----------
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  function km(a, b) {
    const R = 6371, r = Math.PI / 180;
    const dLat = (b[1] - a[1]) * r, dLon = (b[0] - a[0]) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const fmtDist = (d) => d < 1 ? `${Math.round(d * 1000 / 10) * 10} m` : `${d.toLocaleString("de-DE", { maximumFractionDigits: 1 })} km`;
  const plural = (n, one, many) => `${n.toLocaleString("de-DE")} ${n === 1 ? one : many}`;
  const hash = (s) => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
  let toastTimer;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 4200);
  }
  const svg = (d, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"${extra}>${d}</svg>`;
  const ICON_SUN = svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
  const ICON_MOON = svg('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>');
  const ICON_PIN = svg('<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.4"/>');
  const ICON_SHUFFLE = svg('<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>');
  const ICON_BOOKMARK = svg('<path d="M6.5 3.5h11v17l-5.5-4-5.5 4v-17Z"/>');
  const ICON_BOOKMARK_ON = svg('<path d="M6.5 3.5h11v17l-5.5-4-5.5 4v-17Z" fill="currentColor"/>');
  const ICON_CHECK = svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>');
  const ICON_NEAR = svg('<circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/>');

  // ---------- Nutzerdaten (nur im Browser) ----------
  // Pro Ort (stabile Ort-ID aus der Excel, nie die Zeilennummer) zwei unabhängige Markierungen mit Zeitstempel:
  // „saved“ (Merken) und „known“ (Kenn ich). Gespeichert unter USER_KEY als
  //   { app: "sagenhaft", v: 1, updated: ISO, places: { "<ort-id>": { saved?: ISO, known?: ISO } } }
  // Die Zeitstempel erlauben später einen Abgleich mit einem Konto (neuere Änderung gewinnt).
  // Eigene Listen wären später einfach weitere Sammlungen von Ort-IDs, z. B. lists: { "<name>": [ids] }.
  // Kommt das Schema einmal in Version 2, gehört die Umwandlung in migrateUser().
  const USER_KEY = "lore-user", USER_VERSION = 1, USER_KINDS = ["saved", "known"];
  const user = (() => {
    const empty = () => ({ app: "sagenhaft", v: USER_VERSION, updated: null, places: {} });
    function clean(places) {
      const out = {};
      for (const [id, e] of Object.entries(places || {})) {
        if (!id || !e || typeof e !== "object") continue;
        const k = {};
        for (const kind of USER_KINDS) if (typeof e[kind] === "string" && e[kind]) k[kind] = e[kind];
        if (Object.keys(k).length) out[id] = k;
      }
      return out;
    }
    function migrateUser(d) {
      if (!d || typeof d !== "object" || typeof d.places !== "object") return null;
      // Unbekannte Felder (z. B. aus einer neueren Version) bleiben erhalten.
      return { ...empty(), ...d, v: Math.max(+d.v || 1, USER_VERSION), places: clean(d.places) };
    }
    let data = empty();
    try { data = migrateUser(JSON.parse(store.get(USER_KEY) || "null")) || empty(); } catch {}
    const save = () => { data.updated = new Date().toISOString(); store.set(USER_KEY, JSON.stringify(data)); };
    return {
      has: (id, kind) => !!(data.places[id] && data.places[id][kind]),
      set(id, kind, on) {
        const e = data.places[id] || {};
        if (on) e[kind] = new Date().toISOString(); else delete e[kind];
        if (Object.keys(e).length) data.places[id] = e; else delete data.places[id];
        save();
      },
      // Neueste zuerst
      ids: (kind) => Object.entries(data.places).filter(([, e]) => e[kind]).sort((a, b) => b[1][kind].localeCompare(a[1][kind])).map(([id]) => id),
      exportData: () => ({ ...data, exported: new Date().toISOString() }),
      // Wiederherstellen führt zusammen: nichts Vorhandenes geht verloren, bei beiden Seiten gilt der ältere Zeitstempel.
      importData(obj) {
        const d = migrateUser(obj);
        if (!d || (obj.app && obj.app !== "sagenhaft")) return -1;
        let n = 0;
        for (const [id, e] of Object.entries(d.places)) {
          const cur = data.places[id] || {};
          for (const kind of USER_KINDS) if (e[kind] && !cur[kind]) { cur[kind] = e[kind]; n++; }
          if (Object.keys(cur).length) data.places[id] = cur;
        }
        save();
        return n;
      },
    };
  })();
  // Was ein Punkt zeigt: Kenn ich vor Merken vor Vorgeschlagen vor der Wichtigkeit aus der Excel.
  const look = (p) => user.has(p.id, "known") ? "known" : user.has(p.id, "saved") ? "saved" : p.suggested ? "sug" : "";
  // Priorität beim Platzieren: Gemerktes und Vorgeschlagenes wie Touri 1x1. Bekanntes (0) wird nicht verdrängt, sondern immer klein gezeigt, siehe place().
  const rank = (p) => { const l = look(p); return l === "known" ? 0 : l ? 3 : p.importance; };
  const LOOK_TITLE = { known: "Kenn ich", saved: "Gemerkt", sug: "Vorgeschlagen" };

  // ---------- Theme ----------
  const prefersDark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  let theme = store.get("lore-theme") || (prefersDark ? "dark" : "light");
  function applyTheme() {
    document.documentElement.dataset.theme = theme;
    $("#themeBtn").innerHTML = theme === "dark" ? ICON_SUN : ICON_MOON;
    $("#themeBtn").setAttribute("aria-label", theme === "dark" ? "Hellen Modus aktivieren" : "Dunklen Modus aktivieren");
  }
  applyTheme();

  // Der dunkle Grundstil ist sehr kontrastarm (dunkelgraue Straßen auf Schiefer). Nach jedem Laden
  // werden Flächen, Straßen und Beschriftungen deshalb heller und nach Straßenklasse gestaffelt eingefärbt.
  // Beide Anbieter nutzen das OpenMapTiles-Schema, die Zuordnung läuft über source-layer und Layer-Namen.
  const DARK = {
    background: "#1e2328", water: "#1d3546", waterway: "#2a4a60", building: "#2c3238", buildingLine: "#383f46",
    park: "#1f2b25", landuse: "#21272c", boundary: "#58616a", rail: "#59626a", casing: "#15191c",
    road: ["match", ["get", "class"],
      ["motorway", "trunk"], "#a7afb7",
      "primary", "#959ea7",
      ["secondary", "tertiary"], "#7f8891",
      ["minor", "street", "service", "residential", "living_street", "unclassified"], "#646d75",
      ["track", "path", "pedestrian", "footway", "cycleway", "steps", "bridleway"], "#535b62",
      "#69727a"],
    label: "#d9dde1", roadLabel: "#bcc3c9", waterLabel: "#8eaabf", halo: "#15191c",
  };
  // Nach jedem Laden des Grundstils: Gewässernamen und Brunnen der Grundkarte ausblenden (Brunnen haben oft eigene Einträge),
  // Stadtteilflächen einfügen, im Dunkelmodus aufhellen.
  const HIDE_POI = ["fountain"];
  // Alte Filter-Syntax (["==", "class", "x"]) und Ausdrücke (["==", ["get", "class"], "x"]) lassen sich nicht mischen.
  const legacyFilter = (f) => Array.isArray(f) && (["all", "any", "none"].includes(f[0]) ? f.slice(1).some(legacyFilter) : typeof f[1] === "string");
  function withoutPoi(filter) {
    if (!filter) return ["!", ["in", ["get", "subclass"], ["literal", HIDE_POI]]];
    if (legacyFilter(filter)) return ["all", filter, ["!in", "subclass", ...HIDE_POI], ["!in", "class", ...HIDE_POI]];
    return ["all", filter, ["!", ["in", ["get", "subclass"], ["literal", HIDE_POI]]], ["!", ["in", ["get", "class"], ["literal", HIDE_POI]]]];
  }
  function tuneStyle() {
    if (!hasWebGL || !map) return;
    const style = map.getStyle(); if (!style || !style.layers) return;
    for (const l of style.layers) {
      const sl = l["source-layer"] || "";
      if (l.type !== "symbol") continue;
      if (sl === "water_name" || sl === "waterway") {
        try { map.setLayoutProperty(l.id, "visibility", "none"); } catch {}
      } else if (sl === "poi") {
        try { map.setFilter(l.id, withoutPoi(l.filter)); } catch {}
      }
    }
    addAreas(style);
    tuneDarkStyle(style);
  }

  // ---------- Stadtteilflächen ----------
  // Hauchzarte Töne, Nachbarn bekommen verschiedene (Farbnummer c aus tools/make_districts.py).
  const AREA_TONES = ["#c9a477", "#8eae93", "#89a2c4", "#c58e84", "#a399c2", "#c4b266"];
  const AREA = {
    light: { fill: 0.10, line: 0.5, lineColor: "tone", label: "#6f6458", halo: "rgba(255,255,255,.85)" },
    dark: { fill: 0.09, line: 0.45, lineColor: "tone", label: "#b9b0a5", halo: "rgba(20,23,26,.85)" },
  };
  let areaData = {};
  const toneExpr = ["match", ["get", "c"], ...AREA_TONES.flatMap((t, i) => [i, t]), AREA_TONES[0]];
  function addAreas(style) {
    const a = AREA[theme];
    // Unter Straßen und Beschriftungen einfügen, damit die Flächen nur tönen und nichts verdecken.
    const firstRoad = style.layers.find((l) => l["source-layer"] === "transportation" || l["source-layer"] === "building")?.id;
    const firstSymbol = style.layers.find((l) => l.type === "symbol")?.id;
    const font = style.layers.find((l) => l.type === "symbol" && l.layout && l.layout["text-font"])?.layout["text-font"];
    for (const [rid, data] of Object.entries(areaData)) {
      const src = "areas-" + rid;
      if (map.getSource(src)) continue;
      map.addSource(src, { type: "geojson", data, attribution: data.attribution || "" });
      const poly = ["==", ["geometry-type"], "Polygon"], multi = ["==", ["geometry-type"], "MultiPolygon"];
      const isArea = ["any", poly, multi];
      map.addLayer({ id: src + "-fill", type: "fill", source: src, filter: isArea, maxzoom: 17.5,
        paint: { "fill-color": toneExpr, "fill-opacity": ["interpolate", ["linear"], ["zoom"], 9, a.fill * 1.2, 14, a.fill, 17.5, 0] } }, firstRoad);
      map.addLayer({ id: src + "-line", type: "line", source: src, filter: isArea, minzoom: 10,
        paint: { "line-color": toneExpr, "line-opacity": a.line, "line-width": ["interpolate", ["linear"], ["zoom"], 10, 0.8, 15, 1.6] } }, firstSymbol);
      if (font) map.addLayer({ id: src + "-label", type: "symbol", source: src, filter: ["==", ["get", "label"], 1], minzoom: 11.5, maxzoom: 15.5,
        layout: { "text-field": ["upcase", ["get", "name"]], "text-font": font, "text-size": ["interpolate", ["linear"], ["zoom"], 11.5, 10, 15, 12.5],
          "text-letter-spacing": 0.14, "text-max-width": 8, "text-allow-overlap": false, "text-padding": 6 },
        paint: { "text-color": a.label, "text-halo-color": a.halo, "text-halo-width": 1.4,
          "text-opacity": ["interpolate", ["linear"], ["zoom"], 11.5, 0, 12, 0.9, 15, 0.9, 15.5, 0] } }, firstSymbol);
    }
  }
  // Einfachmodus (Leaflet): nur Flächen und Grenzen, ohne Beschriftung.
  let leafletAreas = [];
  function addLeafletAreas() {
    if (hasWebGL || !map || !map.L || !window.L) return;
    leafletAreas.forEach((l) => l.remove()); leafletAreas = [];
    if (!map.L.getPane("areas")) { map.L.createPane("areas").style.zIndex = 350; map.L.getPane("areas").style.pointerEvents = "none"; }
    const a = AREA[theme];
    for (const data of Object.values(areaData)) {
      const layer = L.geoJSON({ ...data, features: data.features.filter((f) => f.geometry.type !== "Point") }, {
        pane: "areas", interactive: false,
        style: (f) => ({ color: AREA_TONES[f.properties.c] || AREA_TONES[0], weight: 1.2, opacity: a.line, fillColor: AREA_TONES[f.properties.c] || AREA_TONES[0], fillOpacity: a.fill }),
      });
      layer.addTo(map.L); leafletAreas.push(layer);
    }
    const attr = Object.values(areaData).map((d) => d.attribution).filter(Boolean).join(", ");
    if (attr && map.L.attributionControl) map.L.attributionControl.addAttribution(attr);
  }

  function tuneDarkStyle(style) {
    if (theme !== "dark") return;
    const set = (id, prop, val) => { try { map.setPaintProperty(id, prop, val); } catch {} };
    for (const l of style.layers) {
      if (l.id.startsWith("areas-")) continue;
      const id = l.id, sl = l["source-layer"] || "", lid = id.toLowerCase();
      if (l.type === "background") set(id, "background-color", DARK.background);
      else if (l.type === "fill") {
        if (sl === "water") set(id, "fill-color", DARK.water);
        else if (sl === "building") { set(id, "fill-color", DARK.building); set(id, "fill-outline-color", DARK.buildingLine); }
        else if (sl === "park" || /park|wood|forest|grass|cemetery|garden/.test(lid)) set(id, "fill-color", DARK.park);
        else if (sl === "landuse" || sl === "landcover" || sl === "aeroway") set(id, "fill-color", DARK.landuse);
      } else if (l.type === "line") {
        if (sl === "waterway") set(id, "line-color", DARK.waterway);
        else if (sl === "transportation") {
          if (/rail|transit|subway|tram/.test(lid)) set(id, "line-color", DARK.rail);
          else if (/casing|outline|case/.test(lid)) set(id, "line-color", DARK.casing);
          else set(id, "line-color", DARK.road);
        } else if (sl === "boundary") set(id, "line-color", DARK.boundary);
      } else if (l.type === "symbol" && l.layout && l.layout["text-field"] != null) {
        const color = sl === "water_name" || sl === "waterway" ? DARK.waterLabel : sl === "transportation_name" ? DARK.roadLabel : DARK.label;
        set(id, "text-color", color); set(id, "text-halo-color", DARK.halo); set(id, "text-halo-width", 1.3);
      }
    }
  }

  // ---------- Daten ----------
  // Bilder: zuerst die aus der Tabelle (Spalten „Bild 1 (Hauptbild)“, „Bild 2“, stehen als images[] an der Geschichte),
  // sonst die automatischen Vorschläge aus data/images.json (Schlüssel = Orts- oder Geschichten-ID).
  async function loadData() {
    const inline = $("#lore-data").textContent.trim();
    if (inline && !inline.startsWith("/*")) {
      const imgs = $("#lore-images").textContent.trim(), areas = $("#lore-areas").textContent.trim(), tags = $("#lore-tags").textContent.trim();
      return { byRegion: JSON.parse(inline), images: imgs && !imgs.startsWith("/*") ? JSON.parse(imgs) : {},
        areas: areas && !areas.startsWith("/*") ? JSON.parse(areas) : {}, tags: tags && !tags.startsWith("/*") ? JSON.parse(tags) : null };
    }
    const byRegion = {};
    for (const r of REGIONS) {
      const res = await fetch(r.file).catch(() => null);
      if (res && res.ok) byRegion[r.id] = await res.json();
      else console.warn("Daten nicht gefunden:", r.file);
    }
    if (!Object.keys(byRegion).length) throw new Error("Keine Daten gefunden");
    const imgRes = await fetch("data/images.json").catch(() => null);
    const areas = {};
    for (const r of REGIONS.filter((r) => r.areas && byRegion[r.id])) {
      const res = await fetch(r.areas).catch(() => null);
      if (res && res.ok) areas[r.id] = await res.json();
    }
    const tagRes = await fetch("data/tags.json").catch(() => null);
    if (!tagRes || !tagRes.ok) console.warn("data/tags.json nicht gefunden, die Filter bleiben leer.");
    return { byRegion, images: imgRes && imgRes.ok ? await imgRes.json() : {}, areas, tags: tagRes && tagRes.ok ? await tagRes.json() : null };
  }

  // Ein Feature ist ein Ort (Pin) mit einer oder mehreren Geschichten. Ältere Dateien mit genau
  // einer Geschichte pro Feature (Frankfurt, Hofheim) werden auf dieselbe Form gebracht.
  function normalize(regionId, f, images) {
    const p = f.properties;
    const stories = (p.stories || [{
      id: p.id, title: p.title, kind: p.kind, teaser: p.teaser, story: p.story, categories: p.themes, epochs: p.epochs, tags: [],
      importance: p.importance, period: p.period, status: p.status, sources: p.sources,
    }]).map((s) => ({
      kind: "", teaser: "", period: "", status: "", note: "", ...s,
      story: s.story || [], categories: s.categories || [], epochs: s.epochs || [], tags: s.tags || [], sources: s.sources || [],
      importance: +s.importance || 1, suggested: !!s.suggested,
    }));
    const place = {
      id: p.id, region: regionId, title: p.title, coord: f.geometry.coordinates,
      importance: Math.max(...stories.map((s) => s.importance)),
      suggested: !!p.suggested || stories.some((s) => s.suggested),
      place: { stadtteil: "", stadt: "", bundesland: "", ...p.place }, address: p.address || "", precision: p.precision || "genau",
      stories, rand: Math.random(), match: [],
    };
    const seen = new Set();
    // Tabelle vor Vorschlägen: wichtigste Geschichte zuerst, je Geschichte Bild 1 vor Bild 2.
    const own = stories.flatMap((s) => [...(s.images || [])].sort((a, b) => (a.slot || 1) - (b.slot || 1)));
    place.images = (own.length ? own : [p.id, ...stories.map((s) => s.id)].flatMap((k) => images[k] || []))
      .filter((im) => im && im.url && !seen.has(im.url) && seen.add(im.url));
    for (const s of stories) {
      s.place = place;
      s.time = timeTags(s); s.topics = topicTags(s);
      s.hay = `${p.title} ${s.title} ${s.kind} ${s.teaser} ${place.place.stadtteil} ${place.address} ${s.categories.join(" ")} ${s.epochs.join(" ")} ${s.tags.join(" ")} ${s.time.join(" ")} ${s.topics.join(" ")} ${s.story.join(" ")}`.toLowerCase();
    }
    return place;
  }

  // ---------- Anzeige-Tags ----------
  // Nutzer sehen nur Tags: Zeit-Tags (Frühzeit bis Gegenwart) und Themen-Tags. Woraus sie entstehen, steht in data/tags.json;
  // die Kategorien, Epochen und Themen aus der Excel bleiben unverändert in den Daten (Suche, Hinweise, spätere Nutzung).
  let TAGCFG = { zeit: [], themen: [], minGeschichten: 1 };
  // Jahr der Geschichte: Spalte Jahr, sonst grob aus dem Zeitraum („um 400 v. Chr.“, „14. Jh.“, „1.–3. Jahrhundert“).
  function storyYear(s) {
    if (Number.isFinite(s.year)) return s.year;
    const t = String(s.period || ""), bc = /v\.\s*Chr/.test(t);
    let m = t.match(/(\d{1,2})\.(?:\s*[–-]\s*\d{1,2}\.)?\s*(?:Jh|Jahrhundert)/);
    if (m) return bc ? -(+m[1] * 100 - 50) : +m[1] * 100 - 50;
    m = t.match(/\d{3,4}/);
    return m ? (bc ? -m[0] : +m[0]) : null;
  }
  // Teilen sich mehrere Zeit-Tags eine Epoche (Mittelalter & früher), entscheidet das Jahr über bisJahr; ohne Jahr gilt der letzte.
  // Geschichten ohne Epoche bekommen ihren Zeit-Tag allein über das Jahr.
  function timeTags(s) {
    const year = storyYear(s), Z = TAGCFG.zeit;
    const byYear = (list) => year == null ? list[list.length - 1] : list.find((z) => z.bisJahr == null || year <= z.bisJahr) || list[list.length - 1];
    const out = new Set();
    for (const e of s.epochs) { const c = Z.filter((z) => z.aus.includes(e)); if (c.length) out.add(byYear(c).tag); }
    if (!s.epochs.length && year != null && Z.length) out.add(byYear(Z).tag);
    return Z.map((z) => z.tag).filter((t) => out.has(t));
  }
  const wordRx = (words) => new RegExp(`(?<![A-Za-zÄÖÜäöüß])(?:${words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`);
  function topicTags(s) {
    const own = new Set([...s.categories, ...s.epochs, ...s.tags]);
    return TAGCFG.themen.filter((t) => (t.aus || []).some((x) => own.has(x))
      || (t.rx && (!t.woerterNurMit || t.woerterNurMit.some((x) => own.has(x))) && t.rx.test(`${s.title} ${s.teaser}`))).map((t) => t.tag);
  }
  function setTagConfig(cfg) {
    if (!cfg) return;
    TAGCFG = { minGeschichten: cfg.minGeschichten || 1, zeit: cfg.zeit || [],
      themen: (cfg.themen || []).map((t) => ({ ...t, rx: t.woerter && t.woerter.length ? wordRx(t.woerter) : null })) };
  }

  // ---------- Zustand ----------
  const state = {
    places: [], stories: [], meta: {}, region: REGIONS[0].id, matchCount: 0,
    epochs: new Set(), tags: new Set(), pick: new Set(), mineOpen: false, mineTab: "saved", minImp: 1, district: "", q: "",
    selected: null, user: null, view: "map", heroShift: 0, tagsOpen: false,
  };
  // epochs = Zeit-Tags, tags = Themen-Tags (beide aus data/tags.json abgeleitet).
  const F = { epochs: "time", tags: "topics" };
  const PICK = { sug: "Vorgeschlagen" };

  // Ohne WebGL (z. B. abgeschaltete Hardwarebeschleunigung) läuft die Karte auf Rasterkacheln mit Leaflet.
  const hasWebGL = (() => {
    try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch { return false; }
  })();
  const GL = hasWebGL ? maplibregl : window.leafletShim;
  let map;
  loadData().then(init).catch((e) => {
    $("#listMeta").textContent = "Die Lore-Daten konnten nicht geladen werden. Öffne die Einzeldatei oder starte einen lokalen Webserver.";
    console.error(e);
  });

  function init({ byRegion, images, areas = {}, tags }) {
    areaData = areas;
    setTagConfig(tags);
    regions = REGIONS.filter((r) => byRegion[r.id]);
    const fromUrl = new URLSearchParams(location.search).get("stadt");
    state.region = [fromUrl, store.get("lore-region")].find((r) => r && byRegion[r]) || regions[0].id;
    for (const r of regions) {
      state.meta[r.id] = byRegion[r.id].lore || {};
      for (const f of byRegion[r.id].features) state.places.push(normalize(r.id, f, images));
    }
    state.stories = state.places.flatMap((p) => p.stories);
    $("#fRegion").innerHTML = regions.map((r) => `<option value="${r.id}">${esc(r.name)}</option>`).join("");
    $("#fRegion").value = state.region;
    buildFilters(); computeMatches();
    map = new GL.Map({
      container: "map",
      style: STYLES[theme],
      center: regionById(state.region).center,
      zoom: regionById(state.region).zoom,
      minZoom: 5,
      maxZoom: 19,
      attributionControl: { compact: true },
      dragRotate: false,
      pitchWithRotate: false,
    });
    map.touchZoomRotate.disableRotation();
    for (const p of state.places) createPin(p);
    let raf = 0;
    const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; place(); }); };
    map.on("move", schedule);
    map.on("resize", schedule);
    map.on("moveend", renderList);
    map.on("load", () => { place(); renderList(); });
    map.on("style.load", tuneStyle);
    addLeafletAreas();
    // Schlägt das Laden des Kartenstils oder der Kacheln fehl, erst den nächsten Anbieter probieren, dann eine sichtbare Meldung zeigen.
    let errTimer;
    map.on("error", (e) => {
      const msg = (e && e.error && (e.error.message || e.error.status)) || "unbekannter Fehler";
      console.error("[Lore-Karte] Kartenfehler:", e && e.error, e && e.sourceId);
      const styleFailed = !map.isStyleLoaded() && !(e && e.sourceId);
      clearTimeout(errTimer);
      errTimer = setTimeout(() => {
        if (map.loaded() && !styleFailed) return;
        if (styleSet < STYLE_SETS.length - 1) {
          styleSet++; map.setStyle(STYLES[theme]);
          toast(`Kartenanbieter nicht erreichbar, wechsle zu ${STYLE_SETS[styleSet].name}.`);
        } else {
          toast(`Die Kartenkacheln lassen sich nicht laden (${msg}). Prüfe deine Internetverbindung, Werbeblocker und die Browser-Konsole (F12).`);
        }
      }, 1500);
    });
    // Am Handy ist das Bottom-Sheet klein: Filter dort eingeklappt starten, am Desktop offen.
    if (window.innerWidth <= 760) { $("#filters").hidden = true; $("#filterToggle").setAttribute("aria-expanded", "false"); }
    wireUi();
    place(); renderList();
    if (!hasWebGL) toast("WebGL ist in deinem Browser aus. Die Karte läuft im Einfachmodus mit Rasterkacheln.");
    const fromHash = decodeURIComponent(location.hash.slice(1));
    if (fromHash === "entdecken") setView("discover");
    else if (fromHash === "meine") openMine();
    else if (fromHash) {
      const p = state.places.find((x) => x.id === fromHash) || state.stories.find((s) => s.id === fromHash)?.place;
      if (p) { setRegion(p.region, { fly: false }); openDetail(p.id, { fly: true, story: fromHash !== p.id ? fromHash : null }); }
    }
  }

  // ---------- Filter ----------
  const regionStories = () => state.stories.filter((s) => s.place.region === state.region);
  function facetValues(key) {
    const counts = new Map();
    for (const s of regionStories()) for (const v of s[F[key]]) counts.set(v, (counts.get(v) || 0) + 1);
    const order = (key === "epochs" ? TAGCFG.zeit : TAGCFG.themen).map((t) => t.tag);
    return [...counts].filter(([, n]) => n >= TAGCFG.minGeschichten).sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]));
  }
  function buildFilters() {
    for (const key of ["epochs", "tags"]) {
      const vals = facetValues(key), set = state[key];
      for (const v of [...set]) if (!vals.some(([x]) => x === v)) set.delete(v);
      const el = $(`.filters [data-f="${key}"]`);
      const limit = key === "tags" && !state.tagsOpen ? TAGS_VISIBLE : Infinity;
      // Gewählte Themen bleiben auch im eingeklappten Zustand sichtbar.
      const shown = vals.filter(([v], i) => i < limit || set.has(v));
      el.innerHTML = shown.map(([v, n]) =>
        `<button class="chip" aria-pressed="${set.has(v)}" data-v="${esc(v)}" title="${plural(n, "Geschichte", "Geschichten")}">${esc(v)}</button>`).join("")
        + (vals.length > shown.length ? `<button class="more" data-more>+${vals.length - shown.length} weitere</button>`
          : key === "tags" && state.tagsOpen && vals.length > TAGS_VISIBLE ? `<button class="more" data-more>weniger</button>` : "");
      el.hidden = !vals.length;
    }
    buildPick();
    $("#fDistrict").setAttribute("aria-label", regionById(state.region).districtLabel);
    fillDistricts();
  }
  // Auswahl: Vorgeschlagen (aus der Excel), nur wenn es in der Stadt welche gibt. Gemerktes zeigt „Meine Orte“.
  function buildPick() {
    const here = state.places.filter((p) => p.region === state.region);
    const avail = { sug: here.some((p) => p.suggested) };
    for (const k of [...state.pick]) if (!avail[k]) state.pick.delete(k);
    const keys = Object.keys(PICK).filter((k) => avail[k]);
    $("#fPick").innerHTML = keys.map((k) => `<button class="chip" aria-pressed="${state.pick.has(k)}" data-v="${k}">${PICK[k]}</button>`).join("");
    $("#fPick").hidden = !keys.length;
  }
  function fillDistricts() {
    const r = regionById(state.region);
    const districts = [...new Set(state.places.filter((p) => p.region === state.region).map((p) => p.place.stadtteil).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de"));
    $("#fDistrict").innerHTML = `<option value="">${r.districtLabel === "Bezirk" ? "Alle Bezirke" : "Alle Stadtteile"}</option>` + districts.map((d) => `<option>${esc(d)}</option>`).join("");
    if (!districts.includes(state.district)) state.district = "";
    $("#fDistrict").value = state.district;
  }
  function setRegion(id, { fly = true } = {}) {
    if (!regions.some((r) => r.id === id)) return;
    const changed = id !== state.region;
    state.region = id; store.set("lore-region", id);
    $("#fRegion").value = id;
    if (changed) { state.heroShift = 0; buildFilters(); computeMatches(); filterSummary(); }
    if (fly && map) { const r = regionById(id); map.flyTo({ center: r.center, zoom: r.zoom, offset: panelOffset(), duration: changed ? 1200 : 600 }); }
    place(); renderList();
    if (state.mineOpen && !state.selected) renderMine();
    if (state.view === "discover") { renderDiscover(); $("#discover").scrollTop = 0; }
  }
  function storyPasses(s) {
    if (s.importance < state.minImp) return false;
    if (state.pick.has("sug") && !s.suggested) return false;
    // Innerhalb der Zeit-Tags und innerhalb der Themen-Tags reicht einer (oder), beide zusammen müssen passen (und).
    if (state.epochs.size && !s.time.some((t) => state.epochs.has(t))) return false;
    if (state.tags.size && !s.topics.some((t) => state.tags.has(t))) return false;
    if (state.q && !state.q.split(/\s+/).every((w) => s.hay.includes(w))) return false;
    return true;
  }
  // Ein Ort passt, wenn mindestens eine seiner Geschichten passt. Das Ergebnis wird je Ort gemerkt,
  // damit die Platzierung beim Verschieben der Karte nicht jedes Mal neu filtern muss.
  function computeMatches() {
    let n = 0;
    for (const p of state.places) {
      p.match = p.region === state.region && (!state.district || p.place.stadtteil === state.district) ? p.stories.filter(storyPasses) : [];
      if (p.match.length) n++;
    }
    state.matchCount = n;
  }
  const passes = (p) => p.match.length > 0;
  function filterSummary() {
    const parts = [...[...state.pick].map((k) => PICK[k]), ...state.epochs, ...state.tags];
    if (state.minImp > 1) parts.push(state.minImp === 3 ? "nur Touri 1x1" : "Sehenswürdigkeiten+");
    if (state.district) parts.push(state.district);
    $("#filterSummary").textContent = parts.join(", ");
  }
  function refresh() { computeMatches(); filterSummary(); place(); renderList(); }

  // ---------- Marker & zoomabhängige Auswahl ----------
  const measure = document.createElement("canvas").getContext("2d");
  function labelWidth(p) {
    if (p.lw) return p.lw;
    measure.font = rank(p) === 3 ? "600 13.5px Literata, Georgia, serif" : "500 12.5px 'Public Sans', system-ui, sans-serif";
    let w = measure.measureText(p.title).width + 14;
    if (p.stories.length > 1) { measure.font = "500 11px 'Public Sans', system-ui, sans-serif"; w += measure.measureText(String(p.stories.length)).width + 5; }
    return (p.lw = w);
  }
  function createPin(p) {
    const el = document.createElement("div");
    el.className = `pin i${p.importance}${p.stories.every((s) => s.status === "Idee") ? " idea" : ""} off`;
    const n = p.stories.length;
    el.innerHTML = `<button aria-label="${esc(p.title)}${n > 1 ? `, ${n} Geschichten` : ""}"><span class="dot"></span><span class="lbl">${esc(p.title)}${n > 1 ? `<small>${n}</small>` : ""}</span></button>`;
    el.querySelector("button").addEventListener("click", (e) => { e.stopPropagation(); openDetail(p.id, { fly: false }); });
    el.addEventListener("mouseenter", () => highlightRow(p.id, true));
    el.addEventListener("mouseleave", () => highlightRow(p.id, false));
    p.el = el; pinLook(p);
    p.marker = new GL.Marker({ element: el, anchor: "center" }).setLngLat(p.coord).addTo(map);
  }

  function pinLook(p) {
    const l = look(p);
    for (const c of ["known", "saved", "sug"]) p.el.classList.toggle(c, l === c);
    p.lw = 0;
  }

  // Greedy-Platzierung in Bildschirmkoordinaten: wichtigere (und zufällig gemischte) Orte zuerst,
  // was nicht mehr passt, wird ausgeblendet statt zu einer Zahl zusammengefasst.
  function place() {
    if (!map) return;
    const z = map.getZoom();
    const w = map.getContainer().clientWidth, h = map.getContainer().clientHeight;
    const pad = z < 12 ? 14 : 9;
    const minZoom = { ...MIN_ZOOM, ...regionById(state.region).minZoom };
    const boxes = [];
    const hit = (b) => boxes.some((o) => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]);
    // Bei engen Filtern (wenige Treffer) alle Treffer unabhängig von der Zoomstufe zeigen.
    const few = state.matchCount <= 15;
    const cand = state.places
      .filter((p) => passes(p) && (few || p.id === state.selected || z >= minZoom[Math.max(1, rank(p))]))
      .map((p) => ({ p, s: map.project(p.coord) }))
      .filter(({ s }) => s.x > -60 && s.y > -30 && s.x < w + 60 && s.y < h + 30)
      .sort((a, b) => (b.p.id === state.selected) - (a.p.id === state.selected) || rank(b.p) - rank(a.p) || b.p.stories.length - a.p.stories.length || a.p.rand - b.p.rand);
    const shown = new Set(), labeled = new Set();
    let farCount = 0;
    for (const { p, s } of cand) {
      const rk = rank(p);
      // Bekannte Orte („Kenn ich“) bleiben ab FAR_ZOOM immer als kleine graue Punkte sichtbar, verdrängen aber nichts.
      if (rk === 0 && p.id !== state.selected) { if (z >= FAR_ZOOM) shown.add(p.id); continue; }
      if (z < FAR_ZOOM && p.id !== state.selected && farCount >= FAR_MAX) continue;
      const r = rk === 3 ? 9 : 7;
      const dot = [s.x - r - pad, s.y - r - pad, s.x + r + pad, s.y + r + pad];
      const wantLabel = p.id === state.selected || ((!canHover || rk === 3) && z >= LABEL_ZOOM[Math.max(1, rk)]);
      const lbl = [s.x + r, s.y - 12, s.x + r + 6 + labelWidth(p), s.y + 12];
      if (wantLabel && !hit(dot) && !hit(lbl)) {
        boxes.push(dot, lbl); shown.add(p.id); labeled.add(p.id);
      } else if (!hit(dot)) {
        boxes.push(dot); shown.add(p.id);
      } else continue;
      farCount++;
    }
    for (const p of state.places) {
      p.el.classList.toggle("off", !shown.has(p.id));
      p.el.classList.toggle("nolabel", !labeled.has(p.id));
      p.el.classList.toggle("sel", p.id === state.selected);
      const rk = rank(p);
      p.el.style.zIndex = p.id === state.selected ? 3 : rk === 3 ? 2 : rk ? 1 : 0;
    }
  }

  // ---------- Liste ----------
  function refPoint() { return state.user || map.getCenter().toArray(); }
  const LIST_MAX = 150;
  // Die Liste erscheint erst, wenn gefiltert, gesucht oder der Standort genutzt wird; sonst bleibt sie leer und die Filter stehen im Vordergrund.
  const browsing = () => state.pick.size || state.user || state.q || state.district || state.minImp > 1 || state.epochs.size || state.tags.size;
  function renderList() {
    if (!map || state.selected || state.mineOpen) return;
    if (!browsing()) {
      $("#listMeta").textContent = "";
      $("#list").innerHTML = "";
      return;
    }
    const ref = refPoint();
    const items = state.places.filter(passes).map((p) => ({ p, d: km(ref, p.coord) })).sort((a, b) => a.d - b.d);
    const nStories = items.reduce((n, { p }) => n + p.match.length, 0);
    const from = state.user ? "deinem Standort" : "der Kartenmitte";
    $("#listMeta").textContent = !items.length ? ""
      : (nStories === items.length ? plural(nStories, "Geschichte", "Geschichten") : `${plural(nStories, "Geschichte", "Geschichten")} an ${plural(items.length, "Ort", "Orten")}`)
        + `, sortiert nach Entfernung zu ${from}`;
    $("#list").innerHTML = items.length ? items.slice(0, LIST_MAX).map(({ p, d }) => itemHtml(p, fmtDist(d))).join("") + (items.length > LIST_MAX ? `<li class="empty">… und ${items.length - LIST_MAX} weitere Orte weiter weg. Verschieb die Karte oder filtere, um sie zu sehen.</li>` : "")
      : `<li class="empty">Keine Geschichten für diese Filter. <button class="reset" data-reset>Filter zurücksetzen</button></li>`;
  }
  function itemHtml(p, right, extraMeta = []) {
    const s = p.match[0] || p.stories[0], multi = p.stories.length > 1;
    const sub = s.title && s.title !== p.title ? `<b>${esc(s.title)}:</b> ${esc(s.teaser)}` : esc(s.teaser);
    const meta = [...extraMeta, p.place.stadtteil, multi ? plural(p.match.length || p.stories.length, "Geschichte", "Geschichten") : s.period, s.topics.slice(0, 2).join(", ")].filter(Boolean);
    const l = look(p);
    return `
      <li><button class="item" data-id="${esc(p.id)}">
        <i class="mk ${l || "i" + p.importance}" title="${l ? LOOK_TITLE[l] : IMPORTANCE[p.importance]}"></i>
        <h3>${esc(p.title)}</h3><span class="dist">${right}</span>
        <p>${sub}</p>
        <span class="meta">${meta.map(esc).join(" · ")}</span>
      </button></li>`;
  }
  function highlightRow(id, on) {
    const row = document.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
    if (row) row.classList.toggle("hl", on);
  }

  // ---------- Detail ----------
  // Detail knapp halten: Titel, eine Kontextzeile, Bilder, Text, Quellen dezent darunter.
  const norm = (t) => String(t || "").toLowerCase().replace(/^(der|die|das|the)\s+/, "").replace(/[^a-zäöüß0-9]+/g, "");
  const similar = (a, b) => { const x = norm(a), y = norm(b); return !!x && !!y && (x.includes(y) || y.includes(x)); };
  // Kontextzeile: Ort und Zeit, dazu nur, was für diesen Eintrag zählt: ob es den Ort noch gibt und ob der Text noch geprüft wird.
  // Filter-Schlagworte gehören in die Filter, nicht in die Detailansicht.
  const GONE = /verschwunden|lost place/i;
  function ctxLine(parts, s) {
    const items = parts.filter(Boolean).map((t) => `<span>${esc(t)}</span>`);
    if (s && s.importance === 3) items.push(`<span class="top">Touri 1x1</span>`);
    if (s && s.suggested) items.push(`<span class="sug">Vorgeschlagen</span>`);
    if (s && [...s.categories, ...s.tags].some((t) => GONE.test(t))) items.push(`<span class="gone">Verschwunden</span>`);
    if (s && s.status === "Idee") items.push(`<span class="soft" title="${esc(s.note || "Noch nicht recherchiert")}">Idee</span>`);
    if (s && s.status === "Prüfen") items.push(`<span class="soft" title="${esc(s.note ? "Wird noch geprüft: " + s.note : "Wird noch geprüft")}">wird geprüft</span>`);
    return items.length ? `<div class="ctx">${items.join('<span class="dot-sep">·</span>')}</div>` : "";
  }
  const sourceLinks = (s) => s.sources.map((x) => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label || "Quelle")}</a>`).join("");
  // Ein durchgehender Text in normaler Schrift: Teaser und Volltext werden nicht mehr unterschieden.
  const textHtml = (s) => { const dup = s.teaser && s.story[0] && s.story[0].startsWith(s.teaser.replace(/[.…]+$/, "")); const ps = [dup ? "" : s.teaser, ...s.story].filter(Boolean); return ps.length ? `<div class="story">${ps.map((x) => `<p>${esc(x)}</p>`).join("")}</div>` : ""; };
  function storyHtml(s, { other = false } = {}) {
    return `<section class="st${other ? " other" : ""}" id="st-${esc(s.id)}">
      ${similar(s.title, s.place.title) ? "" : `<h3>${esc(s.title)}</h3>`}
      ${ctxLine([s.period], { ...s, importance: 0 })}
      ${textHtml(s, false)}
      ${s.sources.length ? `<div class="src">${sourceLinks(s)}</div>` : ""}
    </section>`;
  }
  function openDetail(id, { fly = true, story = null } = {}) {
    const p = state.places.find((x) => x.id === id); if (!p) return;
    state.selected = id;
    const d = state.user ? km(state.user, p.coord) : null;
    const dist = d != null ? `${fmtDist(d)} entfernt` : "";
    const district = similar(p.place.stadtteil, p.title) ? "" : p.place.stadtteil;
    const single = p.stories.length === 1 ? p.stories[0] : null;
    let head, body, sources = "";
    if (single) {
      // Eine Geschichte: ihr Titel ist die Überschrift, der Ortsname steht nur dabei, wenn er etwas Neues sagt.
      const placeName = similar(single.title, p.title) ? "" : p.title;
      head = `<h2>${esc(single.title)}</h2>${ctxLine([placeName, district, single.period, dist], single)}`;
      body = `${galleryHtml(p)}${textHtml(single, true)}`;
      sources = sourceLinks(single);
    } else {
      // Treffer der aktuellen Filter zuerst, die übrigen Geschichten des Orts darunter.
      const hits = p.match.length ? p.match : p.stories;
      const rest = p.stories.filter((s) => !hits.includes(s));
      head = `<h2>${esc(p.title)}</h2>${ctxLine([district, plural(p.stories.length, "Geschichte", "Geschichten"), dist], { importance: p.importance, suggested: p.suggested, categories: [], tags: [] })}`;
      body = `${galleryHtml(p)}
        ${hits.map((s) => storyHtml(s)).join("")}
        ${rest.length ? `<div class="sep-other">Außerdem hier</div>${rest.map((s) => storyHtml(s, { other: true })).join("")}` : ""}`;
    }
    $("#detail").innerHTML = `
      <div class="dacts">
        <span class="mine-btns" id="mineBtns">${mineButtons(p)}</span>
        <button class="back" id="back" aria-label="Schließen, zurück zur Liste" title="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      ${head}
      ${body}
      ${sources ? `<div class="links">${sources}</div>` : ""}`;
    $("#listView").hidden = true; $("#mine").hidden = true; $("#detail").hidden = false; $("#body").scrollTop = 0;
    if (!$("#panel").classList.contains("reading")) {
      // Beim Lesen klappen die Filter ein; über „Filter“ lassen sie sich aufklappen, ohne dass der Eintrag verschwindet.
      state.filtersWereOpen = !$("#filters").hidden;
      setFiltersOpen(false);
    }
    $("#panel").classList.add("reading");
    wireGallery(p);
    $("#panel").classList.add("expanded");
    try { history.replaceState(null, "", location.pathname + location.search + "#" + encodeURIComponent(story || id)); } catch {}
    const target = story && p.stories.length > 1 && document.getElementById("st-" + story);
    if (target) {
      if (target !== $("#detail .st")) target.scrollIntoView({ block: "start" });
      target.classList.add("flash");
    }
    if (fly) {
      map.flyTo({ center: p.coord, zoom: Math.max(map.getZoom(), 16), offset: panelOffset(), duration: 900 });
    } else {
      const s = map.project(p.coord), c = map.getContainer();
      const leftEdge = window.innerWidth > 760 ? 400 : 0;
      if (s.x < leftEdge + 30 || s.x > c.clientWidth - 30 || s.y < 30 || s.y > c.clientHeight * (window.innerWidth > 760 ? 1 : 0.5)) {
        map.easeTo({ center: p.coord, offset: panelOffset(), duration: 600 });
      }
    }
    place();
  }
  // ---------- Bildergalerie ----------
  function galleryHtml(p) {
    if (!p.images.length) return "";
    const chev = (d) => svg(`<path d="${d}"/>`);
    const many = p.images.length > 1;
    return `<figure class="gallery" id="gallery" data-i="0" role="group" aria-roledescription="Bildergalerie" aria-label="Bilder zu ${esc(p.title)}" style="margin-bottom:20px">
      <div class="g-stage">
        <img id="gImg" alt="" loading="lazy" referrerpolicy="no-referrer">
        ${many ? `<button class="g-nav g-prev" data-g="-1" aria-label="Vorheriges Bild">${chev("m15 18-6-6 6-6")}</button>
        <button class="g-nav g-next" data-g="1" aria-label="Nächstes Bild">${chev("m9 18 6-6-6-6")}</button>` : ""}
        <span class="g-count" id="gCount"></span>
      </div>
      <figcaption class="g-cap" id="gCap" aria-live="polite"></figcaption>
    </figure>`;
  }
  const credit = (im) => {
    const lic = im.licenseUrl ? `<a href="${esc(im.licenseUrl)}" target="_blank" rel="noopener">${esc(im.license)}</a>` : esc(im.license || "");
    const src = im.source ? `<a href="${esc(im.source)}" target="_blank" rel="noopener">${esc(im.sourceLabel || "Wikimedia Commons")}</a>` : "";
    if (!im.author && !im.license) return src ? `Urheber und Lizenz: ${src}` : "";
    return [im.author ? esc(im.author) : "", lic, src].filter(Boolean).join(", ");
  };
  function showSlide(p, i) {
    const g = $("#gallery"); if (!g) return;
    const n = p.images.length; i = (i + n) % n; g.dataset.i = i;
    const im = p.images[i], img = $("#gImg");
    img.onerror = () => { $("#gCap").textContent = "Dieses Bild konnte nicht geladen werden."; };
    img.src = im.url; img.alt = im.alt || im.title || p.title;
    $("#gCount").textContent = n > 1 ? `${i + 1} / ${n}` : "";
    $("#gCount").hidden = n < 2;
    $("#gCap").innerHTML = `${im.title ? `<span class="g-title">${esc(im.title)}</span><br>` : ""}${credit(im)}`;
    // nächstes Bild vorladen
    if (n > 1) new Image().src = p.images[(i + 1) % n].url;
  }
  function wireGallery(p) {
    const g = $("#gallery"); if (!g) return;
    showSlide(p, 0);
    g.addEventListener("click", (e) => {
      const b = e.target.closest("[data-g]"); if (b) showSlide(p, +g.dataset.i + +b.dataset.g);
    });
    g.tabIndex = 0;
    g.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") { showSlide(p, +g.dataset.i - 1); e.preventDefault(); }
      if (e.key === "ArrowRight") { showSlide(p, +g.dataset.i + 1); e.preventDefault(); }
    });
    let x0 = null;
    g.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
    g.addEventListener("touchend", (e) => {
      if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) showSlide(p, +g.dataset.i + (dx < 0 ? 1 : -1));
    });
  }
  function setFiltersOpen(open) {
    $("#filters").hidden = !open;
    $("#filterToggle").setAttribute("aria-expanded", open);
  }
  function closeDetail() {
    state.selected = null;
    $("#detail").hidden = true;
    if (state.mineOpen) { renderMine(); $("#mine").hidden = false; } else $("#listView").hidden = false;
    if ($("#panel").classList.contains("reading") && state.filtersWereOpen) setFiltersOpen(true);
    $("#panel").classList.remove("reading");
    try { history.replaceState(null, "", location.pathname + location.search + (state.mineOpen ? "#meine" : "")); } catch {}
    place(); renderList();
  }

  // ---------- Merken, Kenn ich, Meine Orte ----------
  function mineButtons(p) {
    const saved = user.has(p.id, "saved"), known = user.has(p.id, "known");
    // Nur Icons; was sie tun, sagen Tooltip und aria-label.
    const sl = saved ? "Gemerkt: nicht mehr merken" : "Merken", kl = known ? "Kenn ich: doch nicht bekannt" : "Kenn ich: Punkt wird grau";
    return `<button class="mine-btn" data-mine="saved" aria-pressed="${saved}" aria-label="${sl}" title="${sl}">${saved ? ICON_BOOKMARK_ON : ICON_BOOKMARK}</button><button class="mine-btn" data-mine="known" aria-pressed="${known}" aria-label="${kl}" title="${kl}">${ICON_CHECK}</button>`;
  }
  function toggleMine(id, kind) {
    const p = state.places.find((x) => x.id === id); if (!p) return;
    const on = !user.has(id, kind);
    user.set(id, kind, on);
    pinLook(p);
    if ($("#mineBtns") && state.selected === id) $("#mineBtns").innerHTML = mineButtons(p);
    updateMineBtn(); buildPick(); refresh();
    if (state.mineOpen && !state.selected) renderMine();
    toast(kind === "saved" ? (on ? "Gemerkt. Der Punkt ist jetzt grün." : "Nicht mehr gemerkt.")
      : (on ? "Als bekannt markiert. Der Punkt bleibt grau auf der Karte." : "Nicht mehr als bekannt markiert."));
  }
  function updateMineBtn() {
    const n = user.ids("saved").length;
    $("#mineBtn").innerHTML = ICON_BOOKMARK + (n ? `<span class="cnt">${n > 99 ? "99+" : n}</span>` : "");
    $("#mineBtn").setAttribute("aria-pressed", state.mineOpen);
  }
  function openMine() {
    if (state.view !== "map") setView("map");
    if (state.selected) { state.mineOpen = true; closeDetail(); }
    state.mineOpen = true;
    $("#listView").hidden = true; $("#mine").hidden = false; $("#body").scrollTop = 0;
    $("#panel").classList.add("expanded");
    renderMine(); updateMineBtn();
    try { history.replaceState(null, "", location.pathname + location.search + "#meine"); } catch {}
  }
  function closeMine() {
    state.mineOpen = false;
    if (state.selected) closeDetail();
    $("#mine").hidden = true; $("#listView").hidden = false;
    updateMineBtn();
    try { history.replaceState(null, "", location.pathname + location.search); } catch {}
    renderList();
  }
  function renderMine() {
    const byId = new Map(state.places.map((p) => [p.id, p]));
    const tabs = { saved: "Gemerkt", known: "Kenne ich" };
    const ids = (k) => user.ids(k).filter((id) => byId.has(id));
    const list = ids(state.mineTab).map((id) => byId.get(id));
    const missing = user.ids(state.mineTab).length - list.length;
    const multi = regions.length > 1;
    const ref = state.user;
    $("#mine").innerHTML = `
      <button class="back" id="mineClose" aria-label="Schließen, zurück zur Liste" title="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="eyebrow">Meine Orte</div>
      <h2>${state.mineTab === "saved" ? "Meine gemerkten Einträge" : "Kenne ich"}</h2>
      <div class="mine-tabs">${Object.entries(tabs).map(([k, t]) => `<button data-tab="${k}" aria-pressed="${state.mineTab === k}">${t} <span class="n">${ids(k).length}</span></button>`).join("")}</div>
      <ul class="list">${list.length ? list.map((p) => itemHtml(p, ref ? fmtDist(km(ref, p.coord)) : "", multi && p.region !== state.region ? [regionById(p.region).name] : [])).join("")
        : `<li class="empty">${state.mineTab === "saved" ? "Noch nichts gemerkt. Öffne einen Ort und tippe auf das Lesezeichen." : "Noch nichts als bekannt markiert. Öffne einen Ort und tippe auf den Haken."}</li>`}</ul>
      ${missing > 0 ? `<p class="list-meta" style="padding:6px 0 0">${plural(missing, "weiterer Ort ist", "weitere Orte sind")} gespeichert, aber in den aktuellen Daten nicht enthalten.</p>` : ""}
      <div class="mine-backup">
        <p>Deine Markierungen liegen nur in diesem Browser. Leerst du den Browser-Speicher oder wechselst das Gerät, sind sie weg. Sichere sie ab und zu als Datei.</p>
        <div class="actions">
          <button class="btn" data-backup="save">Daten sichern</button>
          <button class="btn" data-backup="load">Wiederherstellen</button>
          <input type="file" id="mineFile" accept="application/json,.json" hidden>
        </div>
      </div>`;
  }
  function downloadBackup() {
    const blob = new Blob([JSON.stringify(user.exportData(), null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `sagenhaft-meine-orte-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast("Sicherung gespeichert. Über „Wiederherstellen“ lässt sie sich wieder einlesen.");
  }
  async function restoreBackup(file) {
    let n = -1;
    try { n = user.importData(JSON.parse(await file.text())); } catch {}
    if (n < 0) return toast("Diese Datei ist keine Sicherung von Sagenhaft.");
    for (const p of state.places) pinLook(p);
    updateMineBtn(); buildPick(); refresh(); renderMine();
    toast(n ? `${plural(n, "Markierung", "Markierungen")} wiederhergestellt.` : "Alles aus der Sicherung war schon vorhanden.");
  }
  function panelOffset() {
    return window.innerWidth > 760 ? [(16 + 384) / 2, 0] : [0, -window.innerHeight * 0.22];
  }

  // ---------- Entdecken ----------
  // Kuratierte Seite je Stadt: Geschichte des Tages, Umgebung, das 1x1, Themen und Epochen.
  // Jede Karte führt zum Ort auf der Karte, Themen und Epochen setzen dort den passenden Filter.
  function setView(v) {
    state.view = v;
    $$("[data-view]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.view === v));
    const disc = v === "discover";
    $("#discover").hidden = !disc;
    document.body.classList.toggle("discovering", disc);
    for (const el of [$("#panel"), $("#mapctl"), $("#map")]) el.toggleAttribute("inert", disc);
    const base = location.pathname + location.search;
    if (disc) {
      renderDiscover(); $("#discover").scrollTop = 0;
      try { history.replaceState(null, "", base + "#entdecken"); } catch {}
    } else {
      try { history.replaceState(null, "", base + (state.selected ? "#" + encodeURIComponent(state.selected) : "")); } catch {}
      if (map && map.resize) map.resize();
    }
  }
  // Täglich wechselnd, aber für alle am selben Tag gleich. Bevorzugt Bedeutendes, Geprüftes und Bebildertes.
  function storyOfDay() {
    const all = regionStories().filter((s) => s.teaser);
    let pool = all.filter((s) => s.importance >= 2 && s.status !== "Prüfen" && s.status !== "Idee");
    if (pool.length < 5) pool = all;
    const withImg = pool.filter((s) => s.place.images.length);
    if (withImg.length >= 3) pool = withImg;
    pool.sort((a, b) => a.id.localeCompare(b.id));
    return pool[(hash(today() + state.region) + state.heroShift) % pool.length];
  }
  function card(s, ref) {
    const p = s.place;
    const eyebrow = s.topics[0] || s.kind || IMPORTANCE[s.importance];
    return `<button class="card" data-place="${esc(p.id)}" data-story="${esc(s.id)}">
      <span class="eyebrow">${esc(eyebrow)}</span>
      <h3>${esc(s.title)}</h3>
      <p>${esc(s.teaser)}</p>
      <span class="foot"><span>${esc(p.title !== s.title ? p.title : p.place.stadtteil)}</span><span>${ref ? fmtDist(km(ref, p.coord)) : ""}</span></span>
    </button>`;
  }
  function renderDiscover() {
    const r = regionById(state.region);
    const stories = regionStories();
    if (!stories.length) { $("#dc").innerHTML = `<div class="dc-intro"><h1>Für ${esc(r.name)} gibt es noch keine Geschichten.</h1></div>`; return; }
    const places = state.places.filter((p) => p.region === state.region);
    const seed = hash(today());
    const daily = (a, b) => (hash(a.id) ^ seed) - (hash(b.id) ^ seed);
    const hero = storyOfDay(), hp = hero.place, img = hp.images[0];
    const ref = state.user && km(state.user, r.center) < r.radiusKm ? state.user : null;
    const from = ref || r.center;
    const near = places.map((p) => ({ p, d: km(from, p.coord) })).sort((a, b) => a.d - b.d)
      .map(({ p }) => p.stories[0]).filter((s) => s !== hero).slice(0, 12);
    const must = stories.filter((s) => s.importance === 3 && s !== hero).sort(daily).slice(0, 12);
    const cats = facetValues("tags"), epochs = facetValues("epochs");
    const checking = stories.filter((s) => s.status === "Prüfen").length;
    const others = hp.stories.length - 1;
    const facts = [
      ["Ort", hp.title !== hero.title ? hp.title : ""], [r.districtLabel, hp.place.stadtteil], ["Adresse", hp.address],
      ["Zeit", hero.period], ["Tags", [...hero.time, ...hero.topics].join(", ")],
    ].filter(([, v]) => v);
    const city = r.name.split(" ")[0];
    $("#dc").innerHTML = `
      <div class="dc-intro">
        <div class="kicker">${esc(r.name)}</div>
        <h1>Geschichten, die an Orten hängen</h1>
        <p>${plural(stories.length, "Geschichte", "Geschichten")} an ${plural(places.length, "Ort", "Orten")}: Sagen, Skandale, Szenen und Spuren, die man im Vorbeigehen nicht sieht.</p>
      </div>

      <article class="hero">
        ${img ? `<figure class="hero-img"><img src="${esc(img.url)}" alt="${esc(img.alt || img.title || hp.title)}" referrerpolicy="no-referrer"><figcaption><span>${credit(img)}</span></figcaption></figure>` : ""}
        <div class="hero-txt">
          <div class="kicker">Geschichte des Tages · ${new Date().toLocaleDateString("de-DE", { day: "numeric", month: "long" })}</div>
          <h2>${esc(hero.title)}</h2>
          <p class="lead">${esc(hero.teaser)}</p>
          ${ctxLine([hero.period], hero)}
          <div class="actions">
            <button class="btn primary" data-place="${esc(hp.id)}" data-story="${esc(hero.id)}">${ICON_PIN}Auf der Karte zeigen</button>
            <button class="btn" data-hero-next>${ICON_SHUFFLE}Andere Geschichte</button>
          </div>
        </div>
        ${img ? "" : `<div class="hero-facts"><dl>${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
          ${others > 0 ? `<button class="btn" data-place="${esc(hp.id)}" data-story="${esc(hero.id)}">${plural(others, "weitere Geschichte", "weitere Geschichten")} an diesem Ort</button>` : ""}</div>`}
      </article>

      <section>
        <div class="sec-head"><div><h2>${ref ? "In deiner Nähe" : "Rund um die Mitte"}</h2>
          <p>${ref ? "Die nächsten Orte, sortiert nach Entfernung zu dir." : `Orte nahe dem Zentrum von ${esc(city)}. Mit deinem Standort siehst du, was direkt um dich herum passiert ist.`}</p></div>
          ${ref ? "" : `<button class="btn" data-locate>${ICON_NEAR}Standort verwenden</button>`}</div>
        <div class="row">${near.map((s) => card(s, from)).join("")}</div>
      </section>

      ${must.length ? `<section>
        <div class="sec-head"><div><h2>Das ${esc(city)}-1x1</h2><p>Was man kennen sollte, auch wenn man nur ein Wochenende da ist.</p></div>
          <button class="btn" data-filter="imp" data-v="3">Alle auf der Karte</button></div>
        <div class="row">${must.map((s) => card(s, ref)).join("")}</div>
      </section>` : ""}

      <section>
        <div class="sec-head"><div><h2>Themen</h2><p>Ein Tag öffnet die Karte mit passendem Filter.</p></div></div>
        <div class="tiles">${cats.map(([c, n]) => {
          const sample = stories.filter((s) => s.topics.includes(c)).sort((a, b) => b.importance - a.importance || daily(a, b)).slice(0, 3).map((s) => s.title);
          return `<button class="tile" data-filter="tags" data-v="${esc(c)}"><span class="tn"><h3>${esc(c)}</h3><span class="n">${n}</span></span><p>${esc(sample.join(" · "))}</p></button>`;
        }).join("")}</div>
      </section>

      ${epochs.length ? `<section>
        <div class="sec-head"><div><h2>Zeitreise</h2><p>Nach Zeit auf die Karte.</p></div></div>
        <div class="epoch-chips">${epochs.map(([e, n]) => `<button class="chip" data-filter="epochs" data-v="${esc(e)}">${esc(e)}</button>`).join("")}</div>
      </section>` : ""}

      <p class="dc-foot">${checking ? `${plural(checking, "Geschichte wird", "Geschichten werden")} noch geprüft und sind mit „wird geprüft“ gekennzeichnet. ` : ""}Kartendaten © OpenStreetMap-Mitwirkende.</p>`;
  }
  function goToStory(placeId, storyId) {
    const p = state.places.find((x) => x.id === placeId); if (!p) return;
    setView("map");
    // Der Ort muss unter den aktuellen Filtern sichtbar sein, sonst Filter zurücksetzen.
    if (!passes(p)) { resetAll({ silent: true }); buildFilters(); }
    openDetail(placeId, { fly: true, story: p.stories.length > 1 ? storyId : null });
  }
  function filterAndShow(key, v) {
    if (state.selected) closeDetail();
    resetAll({ silent: true });
    if (key === "imp") state.minImp = +v;
    else state[key].add(v);
    if (key === "tags") state.tagsOpen = true;
    buildFilters(); refresh();
    setView("map");
    const n = fitToMatches();
    toast(`${plural(n, "Ort", "Orte")} für „${key === "imp" ? "Touri 1x1" : v}“. Filter lassen sich im Panel ändern.`);
  }
  // Karte auf alle aktuellen Treffer zoomen; gibt die Zahl der Orte zurück.
  function fitToMatches() {
    const pts = state.places.filter(passes).map((p) => p.coord);
    if (!pts.length) return 0;
    const b = pts.reduce((bb, c) => bb.extend(c), new GL.LngLatBounds(pts[0], pts[0]));
    const wide = window.innerWidth > 760;
    map.fitBounds(b, { padding: { top: 60, bottom: wide ? 60 : window.innerHeight * 0.45, left: wide ? 440 : 30, right: wide ? 70 : 60 }, maxZoom: 15, duration: 900 });
    return pts.length;
  }
  // Nach einem Filterwechsel: liegt kein Treffer mehr im Bild, die Karte auf die Treffer ausrichten.
  const fitIfNoneVisible = () => { if (state.matchCount && !$$(".pin:not(.off)").length) fitToMatches(); };

  // ---------- In meiner Nähe ----------
  let meMarker;
  function locate() {
    const btn = $("#nearBtn");
    if (!navigator.geolocation) { toast("Dein Browser gibt keinen Standort frei."); return; }
    btn.classList.add("busy");
    navigator.geolocation.getCurrentPosition((pos) => {
      btn.classList.remove("busy");
      const here = [pos.coords.longitude, pos.coords.latitude];
      state.user = here;
      if (!meMarker) { const el = document.createElement("div"); el.className = "me"; meMarker = new GL.Marker({ element: el }); }
      meMarker.setLngLat(here).addTo(map);
      // Nächstgelegenen Ort mit Geschichten wählen.
      const nearest = regions.map((r) => ({ r, d: km(here, r.center) })).sort((a, b) => a.d - b.d)[0];
      if (nearest.r.id !== state.region) setRegion(nearest.r.id, { fly: false });
      if (nearest.d > nearest.r.radiusKm) {
        toast(`Du bist etwa ${Math.round(nearest.d)} km von ${nearest.r.name} entfernt, dem nächsten Ort mit Geschichten. Die Liste ist nach Entfernung zu dir sortiert.`);
        map.flyTo({ center: nearest.r.center, zoom: nearest.r.zoom, offset: panelOffset() });
      } else {
        map.flyTo({ center: here, zoom: 16, offset: panelOffset() });
        const near = state.places.filter(passes).filter((p) => km(here, p.coord) < 0.5).length;
        toast(near ? `${plural(near, "Ort", "Orte")} mit Geschichten im Umkreis von 500 m.` : "In 500 m Umkreis gibt es noch keine Geschichten. Die Liste zeigt die nächsten.");
      }
      if (!state.selected) renderList();
      if (state.view === "discover") renderDiscover();
    }, (err) => {
      btn.classList.remove("busy");
      toast(err.code === 1 ? "Standortzugriff wurde abgelehnt. Du kannst ihn in den Browser-Einstellungen erlauben." : "Dein Standort konnte gerade nicht ermittelt werden.");
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  }

  // ---------- UI-Verdrahtung ----------
  // Wichtigkeit hat keinen eigenen Filter mehr (sie ist an den Punkten sichtbar); „Alle auf der Karte“ beim 1x1 auf Entdecken setzt sie noch.
  function resetAll({ silent = false } = {}) {
    state.epochs.clear(); state.tags.clear(); state.pick.clear(); state.minImp = 1; state.district = ""; state.q = "";
    $("#q").value = ""; $("#fDistrict").value = "";
    $$(".filters .chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
    if (silent) { computeMatches(); filterSummary(); } else refresh();
  }
  function wireUi() {
    $("#themeBtn").addEventListener("click", () => {
      theme = theme === "dark" ? "light" : "dark";
      store.set("lore-theme", theme); applyTheme();
      map.setStyle(STYLES[theme]);
      addLeafletAreas();
    });
    $$("[data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
    updateMineBtn();
    $("#mineBtn").addEventListener("click", () => (state.mineOpen && !state.selected && state.view === "map") ? closeMine() : openMine());
    $("#mine").addEventListener("click", (e) => {
      if (e.target.closest("#mineClose")) return closeMine();
      const t = e.target.closest("[data-tab]"); if (t) { state.mineTab = t.dataset.tab; return renderMine(); }
      const bk = e.target.closest("[data-backup]");
      if (bk) return bk.dataset.backup === "save" ? downloadBackup() : $("#mineFile").click();
      const b = e.target.closest(".item"); if (!b) return;
      const p = state.places.find((x) => x.id === b.dataset.id); if (!p) return;
      if (p.region !== state.region) setRegion(p.region, { fly: false });
      if (!passes(p)) { resetAll({ silent: true }); buildFilters(); }
      openDetail(p.id, { fly: true });
    });
    $("#mine").addEventListener("change", (e) => { if (e.target.id === "mineFile" && e.target.files[0]) { restoreBackup(e.target.files[0]); e.target.value = ""; } });
    $("#logo").addEventListener("click", (e) => { e.preventDefault(); setView(state.view === "map" ? "discover" : "map"); });
    $("#fRegion").addEventListener("change", (e) => { if (state.selected) closeDetail(); setRegion(e.target.value); });
    // Suchen und Filtern führt aus „Meine Orte“ zurück zur Ergebnisliste.
    const toList = () => { if (state.mineOpen) closeMine(); };
    $("#q").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); toList(); if (state.selected) closeDetail(); refresh(); });
    $("#filterToggle").addEventListener("click", (e) => {
      const open = $("#filters").hidden; setFiltersOpen(open);
      if ($("#panel").classList.contains("reading")) state.filtersWereOpen = open;
      if (open) $("#panel").classList.add("expanded");
    });
    $("#filters").addEventListener("click", (e) => {
      if (e.target.closest("[data-more]")) { state.tagsOpen = !state.tagsOpen; buildFilters(); return; }
      const b = e.target.closest(".chip"); if (!b) return;
      if (!state.selected) toList();
      const set = state[b.closest("[data-f]").dataset.f], v = b.dataset.v;
      set.has(v) ? set.delete(v) : set.add(v);
      b.setAttribute("aria-pressed", set.has(v)); refresh(); fitIfNoneVisible();
    });
    $("#fDistrict").addEventListener("change", (e) => {
      if (!state.selected) toList();
      state.district = e.target.value; refresh();
      if (state.district) {
        const pts = state.places.filter((p) => p.region === state.region && p.place.stadtteil === state.district).map((p) => p.coord);
        const b = pts.reduce((bb, c) => bb.extend(c), new GL.LngLatBounds(pts[0], pts[0]));
        map.fitBounds(b, { padding: { top: 80, bottom: 80, left: window.innerWidth > 760 ? 440 : 40, right: 80 }, maxZoom: 16 });
      }
    });
    $("#reset").addEventListener("click", () => resetAll());
    $("#list").addEventListener("click", (e) => {
      if (e.target.closest("[data-reset]")) return resetAll();
      const b = e.target.closest(".item"); if (b) openDetail(b.dataset.id, { fly: true });
    });
    $("#list").addEventListener("mouseover", (e) => {
      const b = e.target.closest(".item");
      state.places.forEach((p) => p.el.querySelector(".dot").style.transform = b && p.id === b.dataset.id ? "translate(-50%,-50%) scale(1.35)" : "");
    });
    $("#list").addEventListener("mouseleave", () => state.places.forEach((p) => p.el.querySelector(".dot").style.transform = ""));
    $("#detail").addEventListener("click", (e) => {
      if (e.target.closest("#back")) return closeDetail();
      const m = e.target.closest("[data-mine]"); if (m) return toggleMine(state.selected, m.dataset.mine);
      const t = e.target.closest(".tag[data-f]"); if (!t) return;
      state[t.dataset.f].add(t.dataset.v);
      if (t.dataset.f === "tags") state.tagsOpen = true;
      closeDetail(); buildFilters(); refresh(); fitIfNoneVisible();
      toast(`Gefiltert nach „${t.dataset.v}“.`);
    });
    $("#discover").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.place) return goToStory(b.dataset.place, b.dataset.story);
      if (b.dataset.filter) return filterAndShow(b.dataset.filter, b.dataset.v);
      if (b.hasAttribute("data-hero-next")) { state.heroShift++; renderDiscover(); return; }
      if (b.hasAttribute("data-locate")) locate();
    });
    $("#nearBtn").addEventListener("click", locate);
    $("#zin").addEventListener("click", () => map.zoomIn());
    $("#zout").addEventListener("click", () => map.zoomOut());
    $("#handle").addEventListener("click", () => $("#panel").classList.toggle("expanded"));
    map.on("click", () => { if (window.innerWidth <= 760) $("#panel").classList.remove("expanded"); });
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape" || state.view !== "map") return;
      if (state.selected) closeDetail(); else if (state.mineOpen) closeMine();
    });
  }
})();
</script>
</body>
</html>
