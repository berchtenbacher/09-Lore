<!doctype html>
<html lang="de">
<head>

<title>Sagenhaft · Lore-Karte</title>

<style>
/* Layout: Kopfzeile, darunter Vollbild-Karte mit ruhigem Lese-Panel links (mobil: Bottom-Sheet und Leiste unten).
   „Entdecken“ legt sich als kuratierte Seite über die Karte. Eine Akzentfarbe: roter Sandstein. */
:root {
  --bg: #f4f5f6;
  --surface: #ffffff;
  --ink: #1b1e22;
  --muted: #646b73;
  --line: #e1e4e8;
  --chip: #eef0f2;
  --accent: #9b3a2c;
  --accent-ink: #ffffff;
  --accent-soft: rgba(155, 58, 44, 0.10);
  --halo: rgba(255, 255, 255, 0.92);
  --shadow: 0 1px 2px rgba(20, 24, 28, .06), 0 8px 24px rgba(20, 24, 28, .08);
  /* Vorgeschlagen (Excel-Spalte), Merken und Kenn ich (Nutzerstatus im Browser) */
  --sug: #b7791f;
  --sug-soft: rgba(183, 121, 31, 0.16);
  --saved: #2f8a4f;
  --saved-soft: rgba(47, 138, 79, 0.16);
  --known: #a9afb5;
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --panel-w: 384px;
  --top: 60px;
  --bb: 0px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #171a1d;
  --surface: #1f2327;
  --ink: #eceef0;
  --muted: #a3a9b0;
  --line: #343a40;
  --chip: #2a2f34;
  --accent: #e08b77;
  --accent-ink: #1a0f0c;
  --accent-soft: rgba(224, 139, 119, 0.16);
  --halo: rgba(31, 35, 39, 0.9);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .32);
  --sug: #e3a94f;
  --sug-soft: rgba(227, 169, 79, 0.18);
  --saved: #5cc185;
  --saved-soft: rgba(92, 193, 133, 0.18);
  --known: #5d646b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

#map { position: fixed; top: var(--top); left: 0; right: 0; bottom: var(--bb); background: var(--bg); }

/* ---------- Kopfzeile ---------- */
.topbar {
  position: fixed; z-index: 10; top: 0; left: 0; right: 0; height: var(--top);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
  padding: 0 16px 0 20px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.tb-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.tb-right { display: flex; justify-content: flex-end; gap: 8px; }
.logo { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; font: 600 20px/1 var(--font-display); letter-spacing: -0.015em; white-space: nowrap; }
.logo svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.region { position: relative; display: inline-flex; align-items: center; padding-left: 14px; border-left: 1px solid var(--line); color: var(--muted); min-width: 0; }
.region select { appearance: none; -webkit-appearance: none; border: 0; background: none; color: var(--ink); font: 500 14px/1.3 var(--font-ui); padding: 4px 22px 4px 0; cursor: pointer; min-width: 0; text-overflow: ellipsis; }
.region select option { color: #1b1e22; }
.region svg { position: absolute; right: 2px; width: 14px; height: 14px; pointer-events: none; }
.viewtoggle { display: inline-grid; grid-auto-flow: column; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.viewtoggle button { height: 32px; padding: 0 18px; border: 0; border-radius: 999px; background: none; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--muted); }
.viewtoggle button:hover { color: var(--ink); }
.viewtoggle button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

.icon-btn {
  width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink);
}
.icon-btn:hover { background: var(--chip); }
.icon-btn svg { width: 18px; height: 18px; }

.bottombar { display: none; }

/* ---------- Panel ---------- */
.panel {
  position: fixed; z-index: 5; top: calc(var(--top) + 16px); left: 16px; bottom: 16px; width: var(--panel-w);
  display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
}
.panel-head { padding: 16px 20px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.handle { display: none; }

.search { position: relative; }
.search svg { position: absolute; left: 11px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; height: 38px; padding: 0 12px 0 34px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font: inherit;
}
.search input::placeholder { color: var(--muted); }

.filter-toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); font-size: 12.5px; text-align: left; }
.filter-toggle strong { color: var(--ink); font-weight: 600; }
.filter-toggle svg { width: 14px; height: 14px; flex: none; transition: transform .2s; }
.filter-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }

.filters { display: grid; gap: 14px; max-height: 52vh; overflow-y: auto; margin: 0 -20px; padding: 2px 20px; }
.filters { gap: 10px; }
.chips:empty, .chips[hidden] { display: none; }
/* Vorgeschlagen trägt die Punktfarbe der Karte, damit klar ist, dass es den Punkten entspricht. */
.chips.pick .chip { display: inline-flex; align-items: center; gap: 6px; }
.chips.pick .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sug); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
/* Im Filter laufen Vorgeschlagen, Zeit- und Themen-Tags ohne Umbruch in einem Fluss. */
.tagflow { display: flex; flex-wrap: wrap; gap: 6px; }
.tagflow > .chips { display: contents; }
.tagflow > .chips[hidden] { display: none; }
.chip {
  height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  cursor: pointer; font-size: 12.5px; color: var(--ink); white-space: nowrap;
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.more { height: 28px; padding: 0 6px; border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 12.5px; font-weight: 500; }
.select { height: 34px; width: 100%; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 10px; font: inherit; font-size: 13px; }
.reset { justify-self: start; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 12.5px; font-weight: 500; }

/* Beim Lesen bleiben aufgeklappte Filter knapp, damit der Eintrag darunter Platz hat. */
.panel.reading .filters { max-height: 34vh; }
.panel-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.list-meta { padding: 12px 20px 6px; font-size: 12px; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0 8px 12px; }
.item {
  display: grid; grid-template-columns: 14px 1fr auto; gap: 4px 10px; align-items: baseline; width: 100%; text-align: left;
  padding: 11px 12px; border: 0; border-radius: 10px; background: none; cursor: pointer;
}
.item:hover, .item.hl { background: var(--chip); }
.item .mk { align-self: center; justify-self: center; }
.item h3 { margin: 0; font: 500 15px/1.3 var(--font-display); min-width: 0; }
.item .dist { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.item p { grid-column: 2 / 4; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.item p b { color: var(--ink); font-weight: 500; }
.item .meta { grid-column: 2 / 4; font-size: 11.5px; color: var(--muted); letter-spacing: .01em; }
.empty { padding: 28px 20px; color: var(--muted); }

/* Wichtigkeits-Marker (auch in Listen) */
.mk { display: inline-block; border-radius: 50%; flex: none; }
.mk.i3 { width: 12px; height: 12px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.mk.i2 { width: 9px; height: 9px; background: var(--ink); }
.mk.i1 { width: 8px; height: 8px; border: 1.5px solid var(--ink); background: var(--surface); }
.mk.sug { width: 12px; height: 12px; border: 0; background: var(--sug); box-shadow: 0 0 0 3px var(--sug-soft); }
.mk.saved { width: 12px; height: 12px; border: 0; background: var(--saved); box-shadow: 0 0 0 3px var(--saved-soft); }
.mk.known { width: 8px; height: 8px; border: 0; background: var(--known); box-shadow: none; }

/* ---------- Detail ---------- */
.detail { padding: 16px 24px 28px; }
/* Schließen: kleiner runder Knopf oben rechts, bleibt beim Scrollen sichtbar. */
.back {
  position: sticky; top: 10px; z-index: 2; float: right; display: grid; place-items: center; width: 32px; height: 32px; margin: 2px -8px 0 10px; padding: 0;
  border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--muted); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.back:hover { color: var(--ink); border-color: var(--muted); }
.back svg { width: 15px; height: 15px; }
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.detail h2 { margin: 4px 0 6px; font: 600 23px/1.2 var(--font-display); letter-spacing: -0.015em; text-wrap: balance; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 18px; color: var(--muted); font-size: 13px; }
.lead { font: 500 17px/1.5 var(--font-display); margin: 0 0 16px; }
.story p { font: 400 15.5px/1.68 var(--font-display); margin: 0 0 14px; max-width: 62ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
.tag { padding: 3px 9px; border-radius: 6px; background: var(--chip); font-size: 12px; color: var(--ink); border: 0; cursor: pointer; }
.tag:hover { background: var(--line); }
.tag.loc { background: none; border: 1px solid var(--line); cursor: default; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; }
.links a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.links a:hover { color: var(--ink); }
.ctx { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; margin: 0 0 14px; color: var(--muted); font-size: 13px; }
.ctx .gone, .ctx .top { color: var(--accent); font-weight: 500; }
.ctx .sug { color: var(--sug); font-weight: 500; }
/* Kopfzeile im Detail: Merken, Kenn ich und Schließen als runde Icon-Knöpfe nebeneinander, bleiben beim Scrollen sichtbar. */
.dacts { position: sticky; top: 10px; z-index: 2; float: right; display: flex; gap: 6px; margin: 2px -8px 0 10px; }
.dacts .back { position: static; float: none; margin: 0; }
.mine-btns { display: contents; }
.mine-btn { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.mine-btn:hover { border-color: var(--muted); }
.mine-btn svg { width: 15px; height: 15px; }
.mine-btn[data-mine="saved"][aria-pressed="true"] { background: var(--saved); border-color: var(--saved); color: #fff; }
.mine-btn[data-mine="known"][aria-pressed="true"] { background: var(--known); border-color: var(--known); color: #fff; }
:root[data-theme="dark"] .mine-btn[data-mine="saved"][aria-pressed="true"] { color: #0f2618; }
/* Meine Orte */
.mine-view { padding: 16px 20px 28px; }
.mine-view h2 { margin: 2px 0 14px; font: 600 24px/1.2 var(--font-display); letter-spacing: -0.015em; }
.mine-tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 6px; }
.mine-tabs button { height: 34px; border: 0; background: var(--surface); cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.mine-tabs button + button { border-left: 1px solid var(--line); }
.mine-tabs button[aria-pressed="true"] { background: var(--chip); font-weight: 600; }
.mine-tabs .n { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.mine-view .list { padding: 0; margin: 0 -12px; }
.mine-view .empty { padding: 18px 12px; }
.mine-backup { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.mine-backup p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.mine-backup .actions { margin: 0; gap: 8px; }
.mine-backup .btn { height: 34px; padding: 0 14px; font-size: 13px; }
.icon-btn { position: relative; }
.icon-btn .cnt { position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--saved); color: #fff; font-size: 10.5px; font-weight: 600; line-height: 17px; text-align: center; }
.icon-btn[aria-pressed="true"] { background: var(--chip); border-color: var(--muted); }
.ctx .soft { font-style: italic; cursor: help; }
.st .ctx { margin-bottom: 8px; font-size: 12.5px; }
.detail > .ctx + .st { border-top: 0; padding-top: 2px; }
.badges { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 10px; font-size: 12px; color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.badge.flag { background: var(--accent-soft); color: var(--accent); }
.badge.check { border: 1px dashed var(--line); color: var(--muted); cursor: help; }
.badge.check::before { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; }
.badge.idea { border: 1px dashed var(--accent); color: var(--accent); cursor: help; }
/* Prototyp: Orte, an denen bisher nur Ideen hängen */
.pin.idea .dot { opacity: .6; border-style: dashed; box-shadow: none; }
.pin.idea .lbl { font-style: italic; opacity: .75; }
.n-stories { margin: 6px 0; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.st { padding: 18px 0 6px; border-top: 1px solid var(--line); scroll-margin-top: 12px; }
.n-stories + .st { border-top: 0; padding-top: 8px; }
.st h3 { margin: 0 0 6px; font: 600 19px/1.25 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.st .teaser { font: 400 15.5px/1.6 var(--font-display); margin: 0 0 10px; }
.st .tags { margin: 10px 0 8px; }
.st .src { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; padding-bottom: 8px; }
.st .src a { color: var(--accent); text-decoration: none; font-weight: 500; }
.st .src a:hover { text-decoration: underline; }
.st.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 30% { background: var(--accent-soft); } 100% { background: transparent; } }
.st.other h3 { font-size: 17px; }
.sep-other { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.sep-other + .st { border-top: 0; padding-top: 10px; }

/* ---------- Bildergalerie ---------- */
.gallery { margin: 0 -24px 20px; }
.g-stage { position: relative; aspect-ratio: 3 / 2; background: var(--chip); overflow: hidden; touch-action: pan-y; }
.g-stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
.g-nav { position: absolute; top: 50%; width: 34px; height: 34px; margin-top: -17px; display: grid; place-items: center; border-radius: 50%; border: 0; cursor: pointer; background: var(--halo); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.g-nav:hover { background: var(--surface); }
.g-nav svg { width: 16px; height: 16px; }
.g-prev { left: 10px; } .g-next { right: 10px; }
.g-count { position: absolute; right: 10px; bottom: 10px; padding: 2px 8px; border-radius: 999px; background: var(--halo); font-size: 11.5px; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 1px var(--line); }
.g-cap { padding: 8px 24px 0; font-size: 11.5px; line-height: 1.45; color: var(--muted); }
.g-cap a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.g-cap a:hover { color: var(--ink); }
.g-cap .g-title { color: var(--ink); }
@media (max-width: 760px) { .gallery { margin: 0 -18px 20px; } .g-cap { padding: 8px 18px 0; } }

/* ---------- Karten-Steuerung ---------- */
.mapctl { position: fixed; z-index: 4; top: calc(var(--top) + 16px); right: 16px; display: grid; gap: 8px; justify-items: end; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); cursor: pointer; font-size: 13px; font-weight: 500;
}
.pill:hover { background: var(--chip); }
.pill svg { width: 17px; height: 17px; }
.pill.busy svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.zoombox { display: grid; border-radius: 12px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.zoombox button { width: 38px; height: 38px; display: grid; place-items: center; border: 0; background: none; cursor: pointer; }
.zoombox button + button { border-top: 1px solid var(--line); }
.zoombox button:hover { background: var(--chip); }
.zoombox svg { width: 17px; height: 17px; }


.toast {
  position: fixed; z-index: 20; left: 50%; bottom: calc(40px + var(--bb)); transform: translate(-50%, 12px); max-width: min(440px, calc(100vw - 32px));
  padding: 11px 16px; border-radius: 10px; background: var(--ink); color: var(--surface); font-size: 13px; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Marker auf der Karte ---------- */
.pin { position: absolute; width: 0; height: 0; }
/* MapLibre setzt die Deckkraft am Marker-Element selbst, daher wird der innere Button ausgeblendet. */
.pin button { position: absolute; left: 0; top: 0; padding: 0; border: 0; background: none; cursor: pointer; pointer-events: auto; transition: opacity .18s ease; }
.pin.off button { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .18s ease, visibility 0s .18s; }
.pin .dot { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); border-radius: 50%; transition: transform .15s; }
.pin.i3 .dot { width: 16px; height: 16px; background: var(--accent); border: 2.5px solid var(--surface); box-shadow: 0 0 0 4px var(--accent-soft), 0 1px 4px rgba(0,0,0,.25); }
.pin.i2 .dot { width: 12px; height: 12px; background: var(--ink); border: 2px solid var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.pin.i1 .dot { width: 10px; height: 10px; background: var(--surface); border: 2px solid var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.pin.sug .dot { width: 16px; height: 16px; background: var(--sug); border: 2.5px solid var(--surface); box-shadow: 0 0 0 4px var(--sug-soft), 0 1px 4px rgba(0,0,0,.25); }
.pin.saved .dot { width: 16px; height: 16px; background: var(--saved); border: 2.5px solid var(--surface); box-shadow: 0 0 0 4px var(--saved-soft), 0 1px 4px rgba(0,0,0,.25); }
.pin.known .dot { width: 11px; height: 11px; background: var(--known); border: 2px solid var(--surface); box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
.pin .lbl {
  position: absolute; left: 12px; top: 0; transform: translateY(-50%); white-space: nowrap; pointer-events: auto;
  font: 500 12.5px/1 var(--font-ui); color: var(--ink); padding: 4px 7px; border-radius: 6px; background: var(--halo);
  box-shadow: 0 0 0 1px var(--line); transition: opacity .18s;
}
.pin .lbl small { margin-left: 5px; font: 500 11px/1 var(--font-ui); color: var(--muted); }
.pin.i3 .lbl, .pin.sug .lbl, .pin.saved .lbl { font: 600 13.5px/1 var(--font-display); left: 14px; }
.pin.known .lbl { font: 500 12px/1 var(--font-ui); color: var(--muted); left: 10px; }
.pin.known.idea .dot { border-style: solid; }
.pin.nolabel .lbl { opacity: 0; pointer-events: none; }
/* Mit Maus: Namen ohne feste Beschriftung erscheinen beim Darüberfahren. */

:root[data-theme="dark"] .leaflet-tile-pane { filter: brightness(1.7) contrast(1.06); }

/* ---------- Entdecken ---------- */
.discover { position: fixed; z-index: 6; top: var(--top); left: 0; right: 0; bottom: var(--bb); overflow-y: auto; overscroll-behavior: contain; background: var(--bg); }

.kicker { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

.hero { display: grid; grid-template-columns: 1.15fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }

.hero .lead { margin: 0; font: 400 18px/1.55 var(--font-display); max-width: 58ch; }
.hero .badges { margin: 0; }
.hero-facts { padding: 30px 32px; border-left: 1px solid var(--line); background: var(--bg); display: grid; align-content: center; justify-items: start; gap: 18px; }

.hero-facts dd { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--chip); }

.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.sec-head h2 { margin: 0; font: 600 22px/1.2 var(--font-display); letter-spacing: -0.01em; }

.sec-head .btn { height: 34px; padding: 0 14px; font-size: 13px; flex: none; }
.row { display: grid; grid-auto-flow: column; grid-auto-columns: 272px; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -32px; padding: 2px 32px 12px; scroll-padding: 0 32px; scrollbar-width: thin; }
.card {
  scroll-snap-align: start; text-align: left; display: flex; flex-direction: column; gap: 8px; min-height: 200px;
  padding: 16px 16px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; cursor: pointer;
}
.card:hover { border-color: var(--muted); }
.card .eyebrow { font-size: 10.5px; }

.card .foot span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }
.tile { text-align: left; display: grid; gap: 4px; align-content: start; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; }
.tile:hover { border-color: var(--muted); }
.tile .tn { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.tile h3 { margin: 0; font: 600 16.5px/1.25 var(--font-display); }
.tile .n { font: 500 13px/1 var(--font-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.tile p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.epoch-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.epoch-chips .chip { height: 34px; padding: 0 14px; font-size: 13px; }
.dc-foot { margin: 0; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }

/* ---------- Mobil: Bottom-Sheet und Leiste unten ---------- */
@media (max-width: 760px) {

  .topbar { grid-template-columns: 1fr auto; padding: env(safe-area-inset-top, 0px) max(12px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); gap: 10px; }
  .viewtoggle { display: none; }

  .region { padding-left: 10px; }

  .bottombar {
    display: grid; grid-template-columns: 1fr 1fr; position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; height: var(--bb);
    padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--surface); border-top: 1px solid var(--line);
  }
  .bottombar button { display: grid; justify-items: center; align-content: center; gap: 3px; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 500; }
  .bottombar svg { width: 22px; height: 22px; }
  .bottombar button[aria-pressed="true"] { color: var(--accent); }
  .panel {

    transition: height .25s ease;
  }

  .panel-head { padding: 6px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); gap: 10px; }
  .handle { display: block; justify-self: center; width: 56px; height: 18px; border: 0; background: none; cursor: pointer; position: relative; }
  .handle::after { content: ""; position: absolute; left: 14px; right: 14px; top: 7px; height: 4px; border-radius: 4px; background: var(--line); }
  .filters { max-height: 34vh; }
  .detail { padding: 4px 18px 24px; }
  .detail h2 { font-size: 20px; }
  .mapctl { top: calc(var(--top) + 12px); right: max(12px, env(safe-area-inset-right, 0px)); }
  .pill .txt { display: none; }
  .pill { width: 40px; height: 40px; padding: 0; justify-content: center; }
  .toast { bottom: calc(42vh + var(--bb) + 12px); }
  body.discovering .toast { bottom: calc(var(--bb) + 16px); }
  .maplibregl-ctrl-bottom-right, .leaflet-bottom.leaflet-right { bottom: 42vh; }
  .dc { padding: 22px 16px 40px; gap: 34px; }
  .dc-intro h1 { font-size: 24px; }
  .hero { grid-template-columns: 1fr; border-radius: 16px; }
  .hero-img { min-height: 0; aspect-ratio: 16 / 10; }
  .hero-txt { padding: 22px 20px; }
  .hero h2 { font-size: 27px; }
  .hero .lead { font-size: 16.5px; }
  .hero-facts { border-left: 0; border-top: 1px solid var(--line); padding: 18px 20px; }
  .sec-head { flex-wrap: wrap; align-items: flex-start; }
  .sec-head h2 { font-size: 19px; }
  .row { margin: 0 -16px; padding: 2px 16px 12px; scroll-padding: 0 16px; grid-auto-columns: 78vw; }
  .tiles { grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { padding: 14px; }
  .tile p { display: none; }
}
@media (max-width: 380px) { .tiles { grid-template-columns: 1fr; } .logo span { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="topbar">

</header>

<div id="map" aria-label="Karte"></div>

<aside class="panel" id="panel" aria-label="Lore-Geschichten">
