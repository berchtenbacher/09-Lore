<script id="lore-data" type="application/json">{"type":"FeatureCollection","meta":{"schemaVersion":1,"region":"Frankfurt am Main","license":"Texte: eigene Zusammenfassung, Prototyp","importanceScale":{"3":"Wahrzeichen","2":"Bedeutend","1":"Lokal"}},"features":[{"type":"Feature","id":"roemer","geometry":{"type":"Point","coordinates":[8.68215,50.11055]},"properties":{"id":"roemer","title":"Römer","kind":"Rathaus","importance":3,"themes":["Geschichte","Architektur"],"epochs":["Mittelalter","Frühe Neuzeit"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Römerberg 27","period":"seit 1405","teaser":"Seit über 600 Jahren das Rathaus der Stadt und Schauplatz der Kaiserkrönungen.","story":["1405 kaufte der Rat der Stadt die beiden Bürgerhäuser „Zum Römer“ und „Zum Goldenen Schwan“ und machte sie zum Rathaus. Woher der Name „Römer“ stammt, ist nicht sicher geklärt; eine verbreitete Deutung verweist auf italienische Kaufleute, die hier zu Messezeiten handelten.","Nach den Krönungen im Dom zog der neue Kaiser über den Krönungsweg hierher. Im Kaisersaal fand das Krönungsbankett statt. Die 52 Kaiserbildnisse an den Wänden entstanden erst im 19. Jahrhundert und zeigen die Herrscher von Karl dem Großen bis Franz II.","Die heute so bekannte Stufengiebel-Fassade ist im Kern spätmittelalterlich, wurde aber mehrfach verändert und nach der Zerstörung 1944 wieder aufgebaut."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Römer+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"dom","geometry":{"type":"Point","coordinates":[8.68525,50.1107]},"properties":{"id":"dom","title":"Kaiserdom St. Bartholomäus","kind":"Kirche","importance":3,"themes":["Geschichte","Religion","Architektur"],"epochs":["Mittelalter","Frühe Neuzeit","19. Jahrhundert"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Domplatz 1","period":"Wahlort seit 1356","teaser":"Hier wurden die römisch-deutschen Könige gewählt und später gekrönt, obwohl der Dom nie Bischofssitz war.","story":["Streng genommen ist der „Dom“ keine Kathedrale, denn Frankfurt war nie Sitz eines Bischofs. Seine Bedeutung kam von woanders: Die Goldene Bulle Kaiser Karls IV. legte 1356 Frankfurt als Ort der Königswahl fest, die Kurfürsten berieten dafür in der Wahlkapelle.","Von 1562 bis 1792 fanden hier auch die Krönungen statt, die zuvor in Aachen stattgefunden hatten. Zehn Kaiser wurden in dieser Zeit im Dom gekrönt.","Der rund 95 Meter hohe Westturm wurde ab 1415 gebaut, blieb aber jahrhundertelang unvollendet. Erst nach dem großen Dombrand von 1867 erhielt er seine heutige Spitze."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Kaiserdom+St.+Bartholomäus+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"pfalz","geometry":{"type":"Point","coordinates":[8.6844,50.11045]},"properties":{"id":"pfalz","title":"Kaiserpfalz Franconofurd","kind":"Archäologische Stätte","importance":3,"themes":["Geschichte"],"epochs":["Mittelalter"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Archäologischer Garten, Domplatz","period":"794","teaser":"Die erste schriftliche Erwähnung Frankfurts stammt von 794, als Karl der Große hier eine Synode abhielt.","story":["Am 22. Februar 794 stellte Karl der Große eine Urkunde „super fluvium Moin in loco nuncupante Franconofurd“ aus, am Main an dem Ort, der Franconofurd genannt wird. Das ist die älteste bekannte Nennung der Stadt.","Im selben Jahr versammelte Karl hier eine große Reichssynode, auf der unter anderem über die Bilderverehrung und Glaubensfragen gestritten wurde.","Zwischen Dom und Schirn sind im Archäologischen Garten und im Stadthaus Mauerreste der karolingischen Königspfalz und älterer römischer Bauten zu sehen."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Kaiserpfalz+Franconofurd+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"furt-sage","geometry":{"type":"Point","coordinates":[8.686,50.1087]},"properties":{"id":"furt-sage","title":"Die Furt der Franken","kind":"Sagenort","importance":3,"themes":["Sage","Legende"],"epochs":["Mittelalter"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Mainkai, unterhalb des Doms","period":"Gründungssage","teaser":"Eine Hirschkuh soll Karl dem Großen auf der Flucht vor den Sachsen den Weg durch den Main gezeigt haben.","story":["Der Sage nach wurde Karl der Große mit seinem Heer von den Sachsen bis an den Main gedrängt. Dichter Nebel lag über dem Fluss, eine Brücke gab es nicht.","Da sah man eine Hirschkuh mit ihrem Jungen durch das Wasser waten. Sie zeigte eine seichte Stelle, an der die Franken den Fluss sicher durchqueren konnten. Die Sachsen, die den Weg nicht kannten, blieben zurück.","Zum Dank soll der Ort den Namen „Furt der Franken“ erhalten haben. Der Name Frankfurt geht tatsächlich auf eine Furt zurück, die Geschichte mit der Hirschkuh ist aber eine Sage."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Die+Furt+der+Franken+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"alte-bruecke","geometry":{"type":"Point","coordinates":[8.6888,50.10745]},"properties":{"id":"alte-bruecke","title":"Alte Brücke und Brickegickel","kind":"Brücke","importance":2,"themes":["Sage","Geschichte"],"epochs":["Mittelalter"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Alte Brücke","period":"erstmals 1222 erwähnt","teaser":"Ein goldener Hahn auf der Brücke erinnert an einen Baumeister, der den Teufel überlistete.","story":["Die Alte Brücke war über Jahrhunderte der einzige feste Übergang über den Main zwischen Frankfurt und Sachsenhausen. Sie wurde 1222 erstmals urkundlich erwähnt.","Die Sage erzählt von einem Baumeister, der mit dem Bau nicht rechtzeitig fertig wurde und einen Pakt mit dem Teufel schloss: Der Teufel vollendet die Brücke und bekommt dafür die erste Seele, die sie überquert. Der Baumeister trieb am Eröffnungstag einen Hahn über die Brücke. Der betrogene Teufel zerriss das Tier und schleuderte es durch die Brücke, und die zwei Löcher, die dabei entstanden, ließen sich angeblich nie wieder schließen.","Ein vergoldeter Hahn auf einer Stange an der Brücke, auf Frankfurterisch der „Brickegickel“, erinnert bis heute an die Geschichte."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Alte+Brücke+und+Brickegickel+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"eschenheimer-turm","geometry":{"type":"Point","coordinates":[8.6821,50.11705]},"properties":{"id":"eschenheimer-turm","title":"Eschenheimer Turm","kind":"Stadtturm","importance":3,"themes":["Sage","Geschichte","Architektur"],"epochs":["Mittelalter"],"place":{"stadtteil":"Innenstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Eschenheimer Tor","period":"1400–1428","teaser":"Die neun Löcher in der Wetterfahne soll ein Wilderer geschossen haben, um sein Leben zu retten.","story":["Der Eschenheimer Turm war Teil der spätmittelalterlichen Stadtbefestigung und ist das älteste fast unveränderte Bauwerk der Frankfurter Innenstadt.","Der Sage nach saß hier der Wilderer Hans Winkelsee gefangen und wartete auf seine Hinrichtung. Er bot dem Rat einen Handel an: Wenn er mit neun Schüssen eine Neun in die Wetterfahne auf dem Turm schieße, solle man ihn freilassen. Jeder Schuss saß.","Die Wetterfahne mit den neun Einschusslöchern ist bis heute zu sehen. Ob die Geschichte stimmt, ist nicht belegt, aber kaum ein Frankfurter Bauwerk hat eine bekanntere Sage."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Eschenheimer+Turm+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"paulskirche","geometry":{"type":"Point","coordinates":[8.68075,50.1114]},"properties":{"id":"paulskirche","title":"Paulskirche","kind":"Kirche, Gedenkort","importance":3,"themes":["Geschichte","Erinnerung"],"epochs":["19. Jahrhundert","20. Jahrhundert"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Paulsplatz 11","period":"1848/49","teaser":"Hier tagte 1848 das erste frei gewählte gesamtdeutsche Parlament.","story":["Am 18. Mai 1848 zogen die Abgeordneten der Nationalversammlung in die Paulskirche ein. Sie arbeiteten eine Verfassung mit Grundrechten aus, die Paulskirchenverfassung von 1849, die viele Ideen des späteren Grundgesetzes vorwegnahm.","Das Parlament scheiterte, als der preußische König die angebotene Kaiserkrone ablehnte. Die Paulskirche gilt dennoch als Wiege der deutschen Demokratie.","Nach der Zerstörung 1944 wurde sie als eines der ersten Gebäude der Stadt bis 1948 wieder aufgebaut. Heute wird hier unter anderem der Friedenspreis des Deutschen Buchhandels verliehen."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Paulskirche+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"goethe-haus","geometry":{"type":"Point","coordinates":[8.67765,50.111]},"properties":{"id":"goethe-haus","title":"Goethe-Haus","kind":"Wohnhaus, Museum","importance":3,"themes":["Persönlichkeit","Kultur"],"epochs":["Frühe Neuzeit"],"place":{"stadtteil":"Innenstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Großer Hirschgraben 23","period":"1749","teaser":"Geburtshaus von Johann Wolfgang von Goethe, der hier am 28. August 1749 zur Welt kam.","story":["Goethe wurde in diesem Haus geboren und verbrachte hier seine Kindheit und Jugend. In „Dichtung und Wahrheit“ beschreibt er das Haus, das Puppentheater, das er als Kind geschenkt bekam, und das Treiben der Krönungsfeierlichkeiten von 1764.","Hier schrieb er auch frühe Werke wie den „Götz von Berlichingen“ und „Die Leiden des jungen Werthers“.","Das Haus wurde 1944 zerstört, die Einrichtung war zuvor ausgelagert worden. Nach dem Wiederaufbau 1951 ist es mit dem Deutschen Romantik-Museum nebenan zu besichtigen."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Goethe-Haus+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"justitia","geometry":{"type":"Point","coordinates":[8.68235,50.1104]},"properties":{"id":"justitia","title":"Gerechtigkeitsbrunnen","kind":"Brunnen","importance":2,"themes":["Geschichte","Kultur"],"epochs":["Frühe Neuzeit","19. Jahrhundert"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Römerberg","period":"Krönungsfeste","teaser":"Bei Kaiserkrönungen soll aus diesem Brunnen Wein statt Wasser geflossen sein.","story":["Der Brunnen mit der Justitia steht mitten auf dem Römerberg. Die heutige Bronzefigur stammt von 1887 und ersetzte eine ältere Steinfigur.","Bei den Krönungsfesten wurde das Volk auf dem Römerberg bewirtet: Ein ganzer Ochse wurde gebraten, und aus dem Brunnen floss Wein. Bei Feierlichkeiten wurde dieser Brauch später gelegentlich wiederholt.","Auffällig: Die Frankfurter Justitia trägt keine Augenbinde."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Gerechtigkeitsbrunnen+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"nikolai","geometry":{"type":"Point","coordinates":[8.683,50.10985]},"properties":{"id":"nikolai","title":"Alte Nikolaikirche","kind":"Kirche","importance":1,"themes":["Religion","Architektur"],"epochs":["Mittelalter"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Römerberg 11","period":"13. Jahrhundert","teaser":"Die kleine Kirche am Römerberg diente einst als Ratskapelle.","story":["Die Alte Nikolaikirche wurde im 13. Jahrhundert errichtet und war zeitweise die Hofkapelle der Staufer und danach Ratskapelle des Magistrats.","Vom Dach aus ließ sich das Treiben auf dem Römerberg beobachten. Heute ist die Kirche vor allem für ihr Glockenspiel bekannt, das mehrmals am Tag erklingt."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Alte+Nikolaikirche+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"steinernes-haus","geometry":{"type":"Point","coordinates":[8.6838,50.11085]},"properties":{"id":"steinernes-haus","title":"Steinernes Haus","kind":"Bürgerhaus","importance":1,"themes":["Architektur","Kultur"],"epochs":["Mittelalter"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Markt 44","period":"1464","teaser":"Ein steinernes Patrizierhaus zwischen lauter Fachwerk, heute Sitz des Kunstvereins.","story":["Das Haus wurde 1464 für den Kaufmann Johann von Melem gebaut. Es war ganz aus Stein gemauert, was in der von Fachwerk geprägten Altstadt auffiel und ihm seinen Namen gab.","Nach der Zerstörung im Zweiten Weltkrieg wurde es wieder aufgebaut und ist heute Sitz des Frankfurter Kunstvereins."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Steinernes+Haus+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"goldene-waage","geometry":{"type":"Point","coordinates":[8.6844,50.11075]},"properties":{"id":"goldene-waage","title":"Haus zur Goldenen Waage","kind":"Fachwerkhaus","importance":1,"themes":["Architektur"],"epochs":["Frühe Neuzeit","Gegenwart"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Markt 5","period":"1619 / 2018","teaser":"Das prächtigste Fachwerkhaus der Neuen Altstadt, nach alten Plänen rekonstruiert.","story":["Der niederländische Kaufmann Abraham van Hamel ließ das Haus 1618/19 errichten. Die Waage im Namen weist auf sein Gewerbe hin.","1944 brannte es aus. Im Zuge des Dom-Römer-Projekts wurde es bis 2018 mit originalen Spolien und nach historischen Fotos und Plänen rekonstruiert."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Haus+zur+Goldenen+Waage+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"struwwelpeter","geometry":{"type":"Point","coordinates":[8.684,50.111]},"properties":{"id":"struwwelpeter","title":"Struwwelpeter-Museum","kind":"Museum","importance":2,"themes":["Persönlichkeit","Kultur"],"epochs":["19. Jahrhundert"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Hinter dem Lämmchen 2–4","period":"1845","teaser":"Der Frankfurter Arzt Heinrich Hoffmann erfand den Struwwelpeter als Weihnachtsgeschenk für seinen Sohn.","story":["1844 suchte Heinrich Hoffmann ein Bilderbuch für seinen dreijährigen Sohn und fand nichts, was ihm gefiel. Also zeichnete und dichtete er selbst: den Struwwelpeter, den Suppen-Kaspar, Paulinchen mit dem Feuerzeug.","Freunde überredeten ihn, das Heft zu veröffentlichen. 1845 erschien es und wurde eines der erfolgreichsten deutschen Kinderbücher.","Hoffmann war im Hauptberuf Arzt und leitete später die städtische Anstalt für Irre und Epileptische. Das Museum zeigt sein Werk seit 2019 in der Neuen Altstadt."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Struwwelpeter-Museum+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"saalhof","geometry":{"type":"Point","coordinates":[8.6818,50.1096]},"properties":{"id":"saalhof","title":"Saalhof und Rententurm","kind":"Burg, Museum","importance":2,"themes":["Geschichte","Architektur"],"epochs":["Mittelalter"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Saalhof 1","period":"um 1200","teaser":"Die Saalhofkapelle aus der Stauferzeit ist das älteste erhaltene Bauwerk der Altstadt.","story":["Am Mainufer stand ab dem 12. Jahrhundert ein staufischer Königshof. Seine Kapelle aus der Zeit um 1200 ist erhalten und gilt als ältestes Gebäude der Frankfurter Altstadt.","Der Rententurm daneben wurde um 1456 als Teil der Mainbefestigung gebaut. Hier saß das Rentamt, das Zölle und Abgaben einzog. Heute gehört das Ensemble zum Historischen Museum."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Saalhof+und+Rententurm+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"haus-wertheim","geometry":{"type":"Point","coordinates":[8.68225,50.10985]},"properties":{"id":"haus-wertheim","title":"Haus Wertheim","kind":"Fachwerkhaus","importance":1,"themes":["Architektur","Geschichte"],"epochs":["Frühe Neuzeit"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Fahrtor 1","period":"um 1600","teaser":"Das einzige Fachwerkhaus der Altstadt, das die Bombennächte von 1944 überstand.","story":["Bei den Luftangriffen im März 1944 brannte die mittelalterliche Altstadt fast vollständig nieder. Haus Wertheim blieb als einziges Fachwerkhaus stehen.","Es wird erzählt, dass Feuerwehrleute es gezielt hielten, um einen Fluchtweg aus der brennenden Altstadt zum Main offen zu halten. Ob es so war, ist nicht gesichert, das Haus ist aber das einzige echte Fachwerk-Original der Altstadt."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Haus+Wertheim+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"judengasse","geometry":{"type":"Point","coordinates":[8.6896,50.1118]},"properties":{"id":"judengasse","title":"Judengasse und Börneplatz","kind":"Gedenkort, Museum","importance":3,"themes":["Geschichte","Erinnerung","Persönlichkeit"],"epochs":["Mittelalter","Frühe Neuzeit","20. Jahrhundert"],"place":{"stadtteil":"Innenstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Battonnstraße 47","period":"1462–1811","teaser":"Über drei Jahrhunderte mussten Frankfurts Juden in einer einzigen engen Gasse leben, darunter die Familie Rothschild.","story":["1462 zwang der Rat die jüdische Gemeinde, aus der Nähe des Doms in eine Gasse vor der damaligen Stadtmauer zu ziehen. In der Judengasse lebten zeitweise rund 3.000 Menschen auf engstem Raum, nachts und an Feiertagen wurden die Tore verschlossen.","1744 wurde hier Mayer Amschel Rothschild geboren, der Begründer des Bankhauses Rothschild. Erst Anfang des 19. Jahrhunderts fiel der Ghettozwang.","Das Museum Judengasse zeigt Fundamente der Häuser. Am Neuen Börneplatz erinnert eine Gedenkstätte mit über 11.000 Namen an die Frankfurter Juden, die im Holocaust ermordet wurden."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Judengasse+und+Börneplatz+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"grossmarkthalle","geometry":{"type":"Point","coordinates":[8.7025,50.1097]},"properties":{"id":"grossmarkthalle","title":"Großmarkthalle und Erinnerungsstätte","kind":"Gebäude, Gedenkort","importance":2,"themes":["Erinnerung","Architektur","Geschichte"],"epochs":["20. Jahrhundert","Gegenwart"],"place":{"stadtteil":"Ostend","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Sonnemannstraße 20","period":"1928 / 1941–1945","teaser":"Aus dem Keller der Großmarkthalle wurden mehr als 10.000 Frankfurter Juden deportiert. Heute steht hier die EZB.","story":["Die Großmarkthalle von Martin Elsaesser wurde 1928 eröffnet und war ein Hauptwerk des Neuen Frankfurt.","Zwischen 1941 und 1945 nutzte die Gestapo den Keller und die Gleisanlagen der Halle als Sammelstelle. Von hier aus wurden über 10.000 Jüdinnen und Juden in Ghettos und Vernichtungslager deportiert.","Seit 2014 ist die Halle Teil des Sitzes der Europäischen Zentralbank. Eine Erinnerungsstätte am Gelände erinnert an die Deportationen."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Großmarkthalle+und+Erinnerungsstätte+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"auschwitz-prozess","geometry":{"type":"Point","coordinates":[8.6438,50.1048]},"properties":{"id":"auschwitz-prozess","title":"Haus Gallus und der Auschwitz-Prozess","kind":"Gebäude, Gedenkort","importance":2,"themes":["Erinnerung","Persönlichkeit","Geschichte"],"epochs":["20. Jahrhundert"],"place":{"stadtteil":"Gallus","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Frankenallee 111","period":"1963–1965","teaser":"Hier verhandelte das Frankfurter Schwurgericht im ersten großen Auschwitz-Prozess.","story":["Der hessische Generalstaatsanwalt Fritz Bauer brachte gegen große Widerstände den Prozess gegen Angehörige der SS-Wachmannschaft von Auschwitz zustande.","Die Verhandlung begann im Dezember 1963 im Römer und zog wegen des großen Andrangs 1964 in das Bürgerhaus Haus Gallus um. Der Prozess endete im August 1965 und veränderte den Umgang der Bundesrepublik mit den NS-Verbrechen nachhaltig."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Haus+Gallus+und+der+Auschwitz-Prozess+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"hauptwache","geometry":{"type":"Point","coordinates":[8.6788,50.11395]},"properties":{"id":"hauptwache","title":"Hauptwache","kind":"Wachgebäude","importance":2,"themes":["Geschichte","Architektur"],"epochs":["Frühe Neuzeit","19. Jahrhundert"],"place":{"stadtteil":"Innenstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"An der Hauptwache 15","period":"1730","teaser":"Das barocke Wachhaus gab dem zentralen Platz der Stadt seinen Namen.","story":["Die Hauptwache wurde 1729/30 als Sitz der Stadtwehr und als Gefängnis gebaut.","Am 3. April 1833 stürmten Studenten und Bürger die Wache, um eine Revolution in ganz Deutschland auszulösen. Der Frankfurter Wachensturm scheiterte nach kurzer Zeit.","Heute ist das Gebäude ein Café, unter dem Platz liegt einer der wichtigsten Nahverkehrsknoten der Stadt."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Hauptwache+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"gretchen","geometry":{"type":"Point","coordinates":[8.67815,50.11425]},"properties":{"id":"gretchen","title":"Susanna Margaretha Brandt","kind":"Ereignisort","importance":2,"themes":["Persönlichkeit","Geschichte","Kultur"],"epochs":["Frühe Neuzeit"],"place":{"stadtteil":"Innenstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Platz an der Hauptwache","period":"1772","teaser":"Ihr Schicksal inspirierte Goethe zur Gretchen-Tragödie im „Faust“.","story":["Die Magd Susanna Margaretha Brandt tötete 1771 ihr neugeborenes Kind. Am 14. Januar 1772 wurde sie vor der Hauptwache mit dem Schwert hingerichtet.","Der junge Goethe, damals Anwalt in Frankfurt, verfolgte den Prozess genau. Ihr Fall gilt als Vorbild für Gretchen, die im „Faust“ ebenfalls ihr Kind tötet und dafür verurteilt wird."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Susanna+Margaretha+Brandt+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"katharinenkirche","geometry":{"type":"Point","coordinates":[8.6796,50.11425]},"properties":{"id":"katharinenkirche","title":"Katharinenkirche","kind":"Kirche","importance":1,"themes":["Religion","Persönlichkeit"],"epochs":["Mittelalter","Frühe Neuzeit"],"place":{"stadtteil":"Innenstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"An der Hauptwache 1","period":"1681","teaser":"Hier begann 1522 die Reformation in Frankfurt, und Goethe wurde hier konfirmiert.","story":["In der Vorgängerkirche predigte Hartmann Ibach 1522 im Sinne Luthers. Damit hielt die Reformation in Frankfurt Einzug.","Der heutige barocke Bau entstand 1678 bis 1681. Die Familie Goethe gehörte zur Gemeinde, der junge Johann Wolfgang wurde hier konfirmiert."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Katharinenkirche+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"alte-oper","geometry":{"type":"Point","coordinates":[8.67205,50.1159]},"properties":{"id":"alte-oper","title":"Alte Oper","kind":"Konzerthaus","importance":3,"themes":["Kultur","Architektur","Geschichte"],"epochs":["19. Jahrhundert","20. Jahrhundert"],"place":{"stadtteil":"Innenstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Opernplatz 1","period":"1880","teaser":"Ein Opernhaus, das die Bürger erst bezahlten, dann als Ruine fast verloren und dann wieder aufbauten.","story":["Das Opernhaus wurde 1880 eröffnet, finanziert zu einem großen Teil von Frankfurter Bürgern. Über dem Eingang steht „Dem Wahren Schönen Guten“. Kaiser Wilhelm I. soll bei der Eröffnung gesagt haben: „Das könnte ich mir in Berlin nicht leisten.“","Im Zweiten Weltkrieg brannte das Haus aus. Jahrzehntelang stand die Ruine leer und wurde „Deutschlands schönste Ruine“ genannt, sogar ein Abriss war im Gespräch.","Eine Bürgerinitiative sammelte Spenden für den Wiederaufbau. 1981 wurde die Alte Oper als Konzert- und Kongresshaus neu eröffnet."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Alte+Oper+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"boerse","geometry":{"type":"Point","coordinates":[8.67625,50.1153]},"properties":{"id":"boerse","title":"Börse mit Bulle und Bär","kind":"Gebäude, Skulptur","importance":2,"themes":["Geschichte","Kultur"],"epochs":["19. Jahrhundert","Gegenwart"],"place":{"stadtteil":"Innenstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Börsenplatz 4","period":"1879","teaser":"Frankfurt ist einer der ältesten Börsenplätze der Welt, die Bronzetiere davor sind ein beliebtes Fotomotiv.","story":["Die Frankfurter Börse geht auf das Jahr 1585 zurück, als Kaufleute auf der Messe einheitliche Wechselkurse festlegten. Das heutige Gebäude am Börsenplatz wurde 1879 eingeweiht.","Vor dem Haus stehen Bulle und Bär, Symbole für steigende und fallende Kurse. Der Bulle stößt seine Hörner nach oben, der Bär schlägt mit der Tatze nach unten."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Börse+mit+Bulle+und+Bär+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"schopenhauer","geometry":{"type":"Point","coordinates":[8.6878,50.1091]},"properties":{"id":"schopenhauer","title":"Schopenhauer an der Schönen Aussicht","kind":"Wohnort","importance":2,"themes":["Persönlichkeit"],"epochs":["19. Jahrhundert"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Schöne Aussicht 16","period":"1833–1860","teaser":"Der Philosoph Arthur Schopenhauer lebte fast drei Jahrzehnte in Frankfurt, stets begleitet von einem Pudel.","story":["Schopenhauer zog 1833 nach Frankfurt und blieb bis zu seinem Tod 1860. Die meisten Jahre wohnte er an der Schönen Aussicht direkt am Main.","Die Frankfurter kannten ihn als Sonderling, der täglich spazieren ging, im Englischen Hof zu Mittag aß und seine Pudel, die alle Atma hießen, über alles schätzte. Sein Grab liegt auf dem Hauptfriedhof."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Schopenhauer+an+der+Schönen+Aussicht+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"hauptfriedhof","geometry":{"type":"Point","coordinates":[8.6876,50.1287]},"properties":{"id":"hauptfriedhof","title":"Hauptfriedhof","kind":"Friedhof","importance":1,"themes":["Persönlichkeit","Natur","Kultur"],"epochs":["19. Jahrhundert"],"place":{"stadtteil":"Nordend-West","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Eckenheimer Landstraße 194","period":"1828","teaser":"Auf dem parkartigen Friedhof liegen Schopenhauer, Heinrich Hoffmann und Theodor W. Adorno.","story":["Der Hauptfriedhof wurde 1828 eröffnet und gehört zu den großen historischen Friedhöfen in Deutschland.","Zwischen alten Bäumen liegen zahlreiche bekannte Frankfurter, darunter Arthur Schopenhauer, Struwwelpeter-Erfinder Heinrich Hoffmann und der Philosoph Theodor W. Adorno."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Hauptfriedhof+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"kuhhirtenturm","geometry":{"type":"Point","coordinates":[8.6898,50.1057]},"properties":{"id":"kuhhirtenturm","title":"Kuhhirtenturm","kind":"Stadtturm","importance":1,"themes":["Persönlichkeit","Architektur"],"epochs":["Mittelalter","20. Jahrhundert"],"place":{"stadtteil":"Sachsenhausen-Nord","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Alt-Sachsenhausen, am Mainufer","period":"15. Jahrhundert","teaser":"Im letzten erhaltenen Turm der Sachsenhäuser Befestigung wohnte einst der Komponist Paul Hindemith.","story":["Der Turm gehörte zur Befestigung von Sachsenhausen und ist als einziger Teil davon erhalten. Seinen Namen hat er vom Kuhhirten, der hier zeitweise wohnte.","Von 1923 bis 1927 lebte der Komponist Paul Hindemith im Turm. Heute erinnert eine Ausstellung an ihn."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Kuhhirtenturm+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"frau-rauscher","geometry":{"type":"Point","coordinates":[8.6889,50.10465]},"properties":{"id":"frau-rauscher","title":"Frau-Rauscher-Brunnen","kind":"Brunnen","importance":2,"themes":["Kultur"],"epochs":["20. Jahrhundert"],"place":{"stadtteil":"Sachsenhausen-Nord","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Klappergasse","period":"Fastnachtslied","teaser":"Eine Brunnenfigur aus einem Fastnachtslied, die unaufmerksame Passanten nass spritzt.","story":["„Frau Rauscher aus de Klappergass, die hat e Beul am Ei“: Das Lied über die streitbare Frau aus der Klappergasse ist einer der bekanntesten Frankfurter Fastnachtsschlager.","Der Brunnen zeigt eine füllige Frau mit Beule am Kopf. In unregelmäßigen Abständen spuckt sie einen kräftigen Wasserstrahl auf den Gehweg, zur Freude aller, die nicht getroffen werden."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Frau-Rauscher-Brunnen+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"aeppelwoi","geometry":{"type":"Point","coordinates":[8.6869,50.1052]},"properties":{"id":"aeppelwoi","title":"Apfelwein in Alt-Sachsenhausen","kind":"Kulturort","importance":2,"themes":["Kultur"],"epochs":["19. Jahrhundert","Gegenwart"],"place":{"stadtteil":"Sachsenhausen-Nord","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Große Rittergasse","period":"Tradition","teaser":"Bembel, Geripptes und Handkäs mit Musik: In den Gassen von Sachsenhausen schlägt das Herz der Apfelweinkultur.","story":["In Sachsenhausen gab es früher viele Weinbauern. Als der Weinbau zurückging, wurde Apfelwein zum Getränk der Stadt. In den Apfelweinwirtschaften wird er bis heute aus dem grauen, blau bemalten Steinzeugkrug, dem Bembel, ins „Gerippte“ eingeschenkt.","Ein grüner Kranz über der Tür zeigt traditionell, dass frischer Apfelwein ausgeschenkt wird. Dazu gibt es Handkäs mit Musik oder Grüne Soße."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Apfelwein+in+Alt-Sachsenhausen+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"eiserner-steg","geometry":{"type":"Point","coordinates":[8.6837,50.10805]},"properties":{"id":"eiserner-steg","title":"Eiserner Steg","kind":"Brücke","importance":2,"themes":["Geschichte","Architektur"],"epochs":["19. Jahrhundert","20. Jahrhundert"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Eiserner Steg","period":"1869","teaser":"Eine Fußgängerbrücke, die die Bürger selbst bezahlten und die heute unter tausenden Liebesschlössern ächzt.","story":["Weil die Alte Brücke dem Verkehr nicht mehr genügte, gründeten Frankfurter Bürger eine Aktiengesellschaft und finanzierten den Steg selbst. 1869 wurde er eröffnet, für die Überquerung wurde anfangs Brückengeld verlangt.","Im März 1945 sprengte die Wehrmacht den Steg, er wurde kurz nach dem Krieg wieder aufgebaut. Heute hängen an seinem Geländer unzählige Liebesschlösser."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Eiserner+Steg+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"staedel","geometry":{"type":"Point","coordinates":[8.6741,50.103]},"properties":{"id":"staedel","title":"Städel Museum","kind":"Museum","importance":2,"themes":["Kultur","Persönlichkeit"],"epochs":["19. Jahrhundert"],"place":{"stadtteil":"Sachsenhausen-Nord","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Schaumainkai 63","period":"1815","teaser":"Ein Kaufmann vermachte der Stadt seine Sammlung und sein Vermögen, daraus wurde eines der bedeutendsten Kunstmuseen Deutschlands.","story":["Der Bankier und Kaufmann Johann Friedrich Städel verfügte in seinem Testament, dass aus seiner Kunstsammlung und seinem Vermögen eine Stiftung entstehen solle. Er starb 1816, das Testament von 1815 ist die Gründungsurkunde des Museums.","Nach einem langen Erbstreit konnte das Städel seine Arbeit aufnehmen. Heute zeigt es Kunst aus sieben Jahrhunderten, darunter Werke von Dürer, Rembrandt und Tischbeins „Goethe in der Campagna“."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Städel+Museum+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"gerbermuehle","geometry":{"type":"Point","coordinates":[8.7252,50.1018]},"properties":{"id":"gerbermuehle","title":"Gerbermühle","kind":"Landhaus","importance":2,"themes":["Persönlichkeit","Kultur"],"epochs":["19. Jahrhundert"],"place":{"stadtteil":"Oberrad","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Gerbermühlstraße 105","period":"1815","teaser":"Hier verliebte sich Goethe in Marianne von Willemer, die Suleika seines West-östlichen Divans.","story":["Die Gerbermühle am Main war der Sommersitz des Bankiers Johann Jakob von Willemer. 1814 und 1815 war Goethe hier zu Gast.","Zwischen ihm und Willemers junger Frau Marianne entstand eine tiefe Zuneigung, die in den „West-östlichen Divan“ einging. Erst lange nach ihrem Tod wurde bekannt, dass einige der schönsten Suleika-Gedichte von Marianne selbst stammen."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Gerbermühle+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"palmengarten","geometry":{"type":"Point","coordinates":[8.6572,50.1236]},"properties":{"id":"palmengarten","title":"Palmengarten","kind":"Park","importance":2,"themes":["Natur","Geschichte"],"epochs":["19. Jahrhundert"],"place":{"stadtteil":"Westend-Süd","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Siesmayerstraße 61","period":"1871","teaser":"Die Pflanzen des abgesetzten Herzogs von Nassau wurden zum Grundstock eines Bürgergartens.","story":["Nach der Annexion des Herzogtums Nassau durch Preußen 1866 verkaufte Herzog Adolph seine Pflanzensammlung aus Biebrich. Der Gärtner Heinrich Siesmayer und Frankfurter Bürger kauften sie und gründeten eine Aktiengesellschaft.","1871 öffnete der Palmengarten mit dem großen Palmenhaus. Er ist bis heute einer der größten botanischen Gärten Deutschlands."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Palmengarten+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"senckenberg","geometry":{"type":"Point","coordinates":[8.6519,50.1175]},"properties":{"id":"senckenberg","title":"Senckenberg Naturmuseum","kind":"Museum","importance":2,"themes":["Natur","Kultur"],"epochs":["19. Jahrhundert","20. Jahrhundert"],"place":{"stadtteil":"Westend-Süd","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Senckenberganlage 25","period":"1817 / 1907","teaser":"Dinosaurier vor der Tür und Urpferdchen aus der Grube Messel im Inneren.","story":["Die Senckenbergische Naturforschende Gesellschaft wurde 1817 von Frankfurter Bürgern gegründet, Goethe hatte die Idee unterstützt. Der Name erinnert an den Arzt Johann Christian Senckenberg.","Das Museum an der Senckenberganlage öffnete 1907. Bekannt ist es für seine Dinosaurierskelette und die Fossilien aus der Grube Messel bei Darmstadt."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Senckenberg+Naturmuseum+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"bockenheimer-warte","geometry":{"type":"Point","coordinates":[8.65275,50.11985]},"properties":{"id":"bockenheimer-warte","title":"Bockenheimer Warte","kind":"Wachturm","importance":1,"themes":["Geschichte","Kultur"],"epochs":["Mittelalter","20. Jahrhundert"],"place":{"stadtteil":"Bockenheim","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Bockenheimer Landstraße / Senckenberganlage","period":"1435","teaser":"Ein mittelalterlicher Wachturm und daneben eine Straßenbahn, die scheinbar aus dem Boden bricht.","story":["Die Bockenheimer Warte war einer der Türme der Frankfurter Landwehr, eines Rings aus Wall, Graben und Warten weit vor der Stadtmauer. Von hier aus konnten Wächter herannahende Gefahren melden.","Am Eingang der U-Bahn-Station daneben ragt ein alter Straßenbahnwagen schräg aus dem Pflaster. Das Kunstwerk von 1986 sieht aus, als würde die Bahn aus dem Untergrund auftauchen."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Bockenheimer+Warte+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"ig-farben","geometry":{"type":"Point","coordinates":[8.6668,50.1257]},"properties":{"id":"ig-farben","title":"IG-Farben-Haus","kind":"Gebäude","importance":2,"themes":["Geschichte","Architektur","Erinnerung"],"epochs":["20. Jahrhundert","Gegenwart"],"place":{"stadtteil":"Westend-Nord","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Norbert-Wollheim-Platz 1","period":"1931","teaser":"Konzernzentrale, US-Hauptquartier, Universität: Ein Gebäude, drei Epochen.","story":["Hans Poelzig entwarf das riesige Verwaltungsgebäude für die IG Farben, das 1931 fertig wurde. Der Konzern war tief in die Verbrechen des NS-Regimes verstrickt, unter anderem durch das Werk bei Auschwitz-Monowitz.","Nach 1945 war das Haus das Hauptquartier der amerikanischen Militärregierung, Dwight D. Eisenhower hatte hier sein Büro.","Seit 2001 gehört es zur Goethe-Universität. Der Platz davor ist nach Norbert Wollheim benannt, einem Überlebenden, der die IG Farben auf Entschädigung verklagte."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=IG-Farben-Haus+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"holzhausen","geometry":{"type":"Point","coordinates":[8.6808,50.12575]},"properties":{"id":"holzhausen","title":"Holzhausenschlösschen","kind":"Wasserschloss","importance":1,"themes":["Architektur","Geschichte"],"epochs":["Frühe Neuzeit"],"place":{"stadtteil":"Nordend-West","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Justinianstraße 5","period":"1729","teaser":"Ein kleines Wasserschloss im Park, einst Landsitz einer der ältesten Patrizierfamilien.","story":["Die Familie von Holzhausen gehörte über Jahrhunderte zu den einflussreichsten Geschlechtern der Stadt. An der Stelle einer mittelalterlichen Wasserburg ließ sie 1727 bis 1729 das heutige barocke Schlösschen bauen.","Heute nutzt die Frankfurter Bürgerstiftung das Haus für Konzerte, Lesungen und Ausstellungen."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Holzhausenschlösschen+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"justinus","geometry":{"type":"Point","coordinates":[8.545,50.09935]},"properties":{"id":"justinus","title":"Justinuskirche","kind":"Kirche","importance":2,"themes":["Religion","Architektur"],"epochs":["Mittelalter"],"place":{"stadtteil":"Höchst","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Justinusplatz","period":"9. Jahrhundert","teaser":"Eine der ältesten erhaltenen Kirchen Deutschlands, gebaut im 9. Jahrhundert.","story":["Die Justinuskirche in Höchst wurde im 9. Jahrhundert gebaut und ist das älteste Gebäude Frankfurts. Teile des karolingischen Langhauses sind bis heute erhalten.","Später kam ein gotischer Chor hinzu, die Antoniter betreuten die Kirche ab dem 15. Jahrhundert."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Justinuskirche+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"hoechster-schloss","geometry":{"type":"Point","coordinates":[8.5438,50.10035]},"properties":{"id":"hoechster-schloss","title":"Höchster Schloss","kind":"Burg","importance":1,"themes":["Geschichte","Architektur"],"epochs":["Mittelalter","Frühe Neuzeit"],"place":{"stadtteil":"Höchst","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Schloßplatz","period":"14. Jahrhundert","teaser":"Die Mainzer Erzbischöfe kontrollierten von hier aus den Zoll auf dem Main.","story":["Höchst gehörte lange zu Kurmainz. Die Erzbischöfe ließen hier eine Burg errichten, um den Main-Handel zu kontrollieren und Zoll zu erheben.","Aus der Burg wurde später ein Renaissanceschloss. Bis 1928 war Höchst eine eigene Stadt, erst dann wurde es nach Frankfurt eingemeindet."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Höchster+Schloss+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"bolongaro","geometry":{"type":"Point","coordinates":[8.5478,50.10125]},"properties":{"id":"bolongaro","title":"Bolongaropalast","kind":"Palast","importance":1,"themes":["Persönlichkeit","Architektur"],"epochs":["Frühe Neuzeit"],"place":{"stadtteil":"Höchst","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Bolongarostraße 109","period":"1772–1775","teaser":"Zwei italienische Tabakhändler bauten sich einen Palast, nachdem Frankfurt sie nicht als Bürger aufnehmen wollte.","story":["Die Brüder Bolongaro handelten mit Schnupftabak und wurden damit reich. In Frankfurt wurden ihnen als Katholiken die vollen Bürgerrechte verweigert.","Sie zogen ins kurmainzische Höchst und ließen dort ab 1772 einen Palast mit Garten zum Main bauen, der prächtiger ausfiel als vieles in Frankfurt selbst."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Bolongaropalast+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"nida","geometry":{"type":"Point","coordinates":[8.629,50.1642]},"properties":{"id":"nida","title":"Römerstadt NIDA","kind":"Archäologische Stätte","importance":2,"themes":["Geschichte"],"epochs":["Antike"],"place":{"stadtteil":"Heddernheim","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Zwischen Heddernheim und Praunheim","period":"1.–3. Jahrhundert","teaser":"Lange vor Frankfurt gab es hier eine römische Stadt mit Thermen, Tempeln und Theater.","story":["Im heutigen Heddernheim lag die römische Siedlung NIDA, Hauptort der Civitas Taunensium. Sie entstand im 1. Jahrhundert nach Christus und erlebte ihre Blüte im 2. Jahrhundert.","Mit dem Rückzug der Römer hinter den Rhein um 260 wurde die Stadt aufgegeben. Funde aus NIDA, darunter Heiligtümer des Mithras-Kults, sind im Archäologischen Museum Frankfurt zu sehen."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Römerstadt+NIDA+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"roemerstadt-may","geometry":{"type":"Point","coordinates":[8.6345,50.166]},"properties":{"id":"roemerstadt-may","title":"Siedlung Römerstadt","kind":"Siedlung","importance":2,"themes":["Architektur","Geschichte","Persönlichkeit"],"epochs":["20. Jahrhundert"],"place":{"stadtteil":"Heddernheim","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Hadrianstraße","period":"1927–1928","teaser":"Ernst Mays Siedlung des Neuen Frankfurt, mit der Frankfurter Küche in jeder Wohnung.","story":["Stadtbaurat Ernst May ließ in den 1920er Jahren zahlreiche Siedlungen bauen, um die Wohnungsnot zu lindern: das Neue Frankfurt. Die Römerstadt über dem Niddatal ist eine der bekanntesten.","Die Wohnungen hatten fast alle die Frankfurter Küche der Architektin Margarete Schütte-Lihotzky, die als Urform der modernen Einbauküche gilt."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Siedlung+Römerstadt+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"anne-frank","geometry":{"type":"Point","coordinates":[8.6842,50.1388]},"properties":{"id":"anne-frank","title":"Geburtsort von Anne Frank","kind":"Wohnhaus","importance":2,"themes":["Persönlichkeit","Erinnerung"],"epochs":["20. Jahrhundert"],"place":{"stadtteil":"Dornbusch","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Marbachweg 307","period":"1929","teaser":"Anne Frank wurde 1929 in Frankfurt geboren und verbrachte hier ihre ersten Lebensjahre.","story":["Anne Frank kam am 12. Juni 1929 in Frankfurt zur Welt. Die Familie wohnte zunächst im Marbachweg, später in der Ganghoferstraße.","Nach der Machtübernahme der Nationalsozialisten emigrierte die Familie 1933/34 nach Amsterdam. Dort schrieb Anne im Versteck ihr Tagebuch. Eine Gedenktafel am Haus erinnert an sie."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Geburtsort+von+Anne+Frank+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"goetheturm","geometry":{"type":"Point","coordinates":[8.7004,50.0918]},"properties":{"id":"goetheturm","title":"Goetheturm","kind":"Aussichtsturm","importance":1,"themes":["Natur"],"epochs":["20. Jahrhundert","Gegenwart"],"place":{"stadtteil":"Sachsenhausen-Süd","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Am Goetheturm","period":"1931 / 2020","teaser":"Ein Holzturm am Rand des Stadtwalds, 2017 abgebrannt und von den Frankfurtern zurückgeholt.","story":["Der Goetheturm wurde 1931 aus Holz gebaut und war mit 43 Metern einer der höchsten Holztürme Deutschlands. Von oben sieht man über den Stadtwald auf die Skyline.","Im Oktober 2017 brannte der Turm durch Brandstiftung vollständig ab. Nach Spenden und viel Engagement aus der Stadt wurde er bis 2020 originalgetreu neu errichtet."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Goetheturm+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"lohrberg","geometry":{"type":"Point","coordinates":[8.7345,50.1502]},"properties":{"id":"lohrberg","title":"Lohrberg","kind":"Berg, Weinberg","importance":1,"themes":["Natur","Kultur"],"epochs":["Gegenwart"],"place":{"stadtteil":"Seckbach","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Lohrberg","period":"Weinlage","teaser":"Frankfurts einziger Weinberg, mit Blick über die ganze Stadt.","story":["Früher wurde rund um Frankfurt viel Wein angebaut. Übrig geblieben ist der Lohrberger Hang in Seckbach, die einzige Weinlage innerhalb der Stadtgrenze.","Der Lohrberg-Park auf der Kuppe ist ein beliebtes Ausflugsziel, von hier aus liegt die Skyline wie ein Modell vor einem."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Lohrberg+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"skyline","geometry":{"type":"Point","coordinates":[8.6743,50.1104]},"properties":{"id":"skyline","title":"Commerzbank-Tower","kind":"Hochhaus","importance":2,"themes":["Architektur","Geschichte"],"epochs":["Gegenwart"],"place":{"stadtteil":"Innenstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Kaiserplatz","period":"1997","teaser":"Mit 259 Metern war der Turm von Norman Foster lange das höchste Gebäude der EU.","story":["Frankfurt ist die einzige deutsche Stadt mit einer echten Hochhaus-Skyline, was ihr den Spitznamen „Mainhattan“ eingebracht hat.","Der Commerzbank-Tower von Norman Foster wurde 1997 fertig. Er gilt als eines der ersten ökologischen Hochhäuser, mit Gärten, die sich spiralförmig über mehrere Etagen nach oben ziehen."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Commerzbank-Tower+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"rothschild-palais","geometry":{"type":"Point","coordinates":[8.6735,50.1075]},"properties":{"id":"rothschild-palais","title":"Rothschild-Palais","kind":"Palais, Museum","importance":1,"themes":["Persönlichkeit","Erinnerung","Kultur"],"epochs":["19. Jahrhundert","Gegenwart"],"place":{"stadtteil":"Innenstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Untermainkai 14–15","period":"seit 1846","teaser":"Das ehemalige Wohnhaus der Rothschilds am Main beherbergt heute das Jüdische Museum.","story":["Nach dem Ende des Ghettozwangs konnten jüdische Familien auch außerhalb der Judengasse wohnen. Die Familie Rothschild kaufte 1846 das klassizistische Palais am Untermainkai.","Seit 1988 ist hier das Jüdische Museum Frankfurt untergebracht, das 2020 um einen Neubau erweitert wurde."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Rothschild-Palais+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"leonhard","geometry":{"type":"Point","coordinates":[8.6806,50.10925]},"properties":{"id":"leonhard","title":"Leonhardskirche","kind":"Kirche","importance":1,"themes":["Religion","Architektur"],"epochs":["Mittelalter"],"place":{"stadtteil":"Altstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Am Leonhardstor 25","period":"ab 1219","teaser":"Kaiser Friedrich II. schenkte das Grundstück, die romanischen Portale sind bis heute erhalten.","story":["1219 überließ der Staufer Friedrich II. den Frankfurter Bürgern ein Grundstück am Main für den Bau einer Kirche. Aus dieser Zeit stammen die beiden romanischen Portale.","Die Leonhardskirche gehört zu den wenigen Kirchen der Altstadt, die den Zweiten Weltkrieg weitgehend unbeschadet überstanden."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Leonhardskirche+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}},{"type":"Feature","id":"hessendenkmal","geometry":{"type":"Point","coordinates":[8.6894,50.117]},"properties":{"id":"hessendenkmal","title":"Hessendenkmal","kind":"Denkmal","importance":1,"themes":["Geschichte","Erinnerung"],"epochs":["Frühe Neuzeit"],"place":{"stadtteil":"Innenstadt","stadt":"Frankfurt am Main","kreis":"Kreisfreie Stadt Frankfurt am Main","bundesland":"Hessen"},"address":"Friedberger Anlage","period":"1792","teaser":"Ein Denkmal für hessische Soldaten, die 1792 beim Sturm auf das französisch besetzte Frankfurt fielen.","story":["Im Oktober 1792 besetzten französische Revolutionstruppen Frankfurt. Am 2. Dezember stürmten preußische und hessische Truppen das Friedberger Tor und eroberten die Stadt zurück.","Der preußische König Friedrich Wilhelm II. stiftete das Denkmal für die gefallenen Hessen. Es steht bis heute an der Friedberger Anlage."],"sources":[{"label":"Wikipedia","url":"https://de.wikipedia.org/w/index.php?search=Hessendenkmal+Frankfurt"}],"status":"published","author":"redaktion","updated":"2026-10-20"}}]}</script>
<script>
(() => {
  "use strict";

  // ---------- Konfiguration ----------
  const STYLES = {
    light: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
    dark: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
  };
  const CITY = { name: "Frankfurt am Main", center: [8.6821, 50.1106], radiusKm: 25 };
  const IMPORTANCE = { 3: "Wahrzeichen", 2: "Bedeutend", 1: "Lokal" };
  // Ab welchem Zoom eine Stufe erscheint und ab wann sie beschriftet wird.
  const MIN_ZOOM = { 3: 0, 2: 12.4, 1: 13.9 };
  const LABEL_ZOOM = { 3: 0, 2: 14, 1: 15.3 };
  // Weit herausgezoomt: nur eine Handvoll zufälliger Wahrzeichen statt Zählblasen.
  const FAR_ZOOM = 11.5, FAR_MAX = 4;

  // ---------- Hilfen ----------
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  function km(a, b) {
    const R = 6371, r = Math.PI / 180;
    const dLat = (b[1] - a[1]) * r, dLon = (b[0] - a[0]) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const fmtDist = (d) => d < 1 ? `${Math.round(d * 1000 / 10) * 10} m` : `${d.toLocaleString("de-DE", { maximumFractionDigits: 1 })} km`;
  let toastTimer;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 4200);
  }
  const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>';

  // ---------- Theme ----------
  const prefersDark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  let theme = store.get("lore-theme") || (prefersDark ? "dark" : "light");
  function applyTheme() {
    document.documentElement.dataset.theme = theme;
    $("#themeBtn").innerHTML = theme === "dark" ? ICON_SUN : ICON_MOON;
    $("#themeBtn").setAttribute("aria-label", theme === "dark" ? "Hellen Modus aktivieren" : "Dunklen Modus aktivieren");
  }
  applyTheme();

  // ---------- Daten ----------
  async function loadData() {
    const inline = $("#lore-data").textContent.trim();
    if (inline && !inline.startsWith("/*")) return JSON.parse(inline);
    const res = await fetch("data/frankfurt.geojson");
    if (!res.ok) throw new Error("Daten nicht gefunden");
    return res.json();
  }

  // ---------- Zustand ----------
  const state = {
    items: [], themes: new Set(), epochs: new Set(), minImp: 1, district: "", q: "",
    selected: null, user: null,
  };

  let map;
  loadData().then(init).catch((e) => {
    $("#listMeta").textContent = "Die Lore-Daten konnten nicht geladen werden. Öffne die Einzeldatei oder starte einen lokalen Webserver.";
    console.error(e);
  });

  function init(fc) {
    state.items = fc.features.map((f) => ({
      ...f.properties,
      coord: f.geometry.coordinates,
      rand: Math.random(),
    }));
    buildFilters();
    map = new maplibregl.Map({
      container: "map",
      style: STYLES[theme],
      center: CITY.center,
      zoom: 13.2,
      minZoom: 5,
      maxZoom: 19,
      attributionControl: { compact: true },
      dragRotate: false,
      pitchWithRotate: false,
    });
    map.touchZoomRotate.disableRotation();
    for (const it of state.items) createPin(it);
    let raf = 0;
    const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; place(); }); };
    map.on("move", schedule);
    map.on("resize", schedule);
    map.on("moveend", renderList);
    map.on("load", () => { place(); renderList(); });
    wireUi();
    place(); renderList();
    const fromHash = location.hash.slice(1);
    if (fromHash && state.items.some((i) => i.id === fromHash)) openDetail(fromHash, { fly: true });
  }

  // ---------- Filter ----------
  function buildFilters() {
    const count = (key) => {
      const m = new Map();
      state.items.forEach((i) => i[key].forEach((v) => m.set(v, (m.get(v) || 0) + 1)));
      return m;
    };
    const themeOrder = ["Geschichte", "Sage", "Legende", "Persönlichkeit", "Architektur", "Kultur", "Religion", "Erinnerung", "Natur"];
    const epochOrder = ["Antike", "Mittelalter", "Frühe Neuzeit", "19. Jahrhundert", "20. Jahrhundert", "Gegenwart"];
    const sortBy = (order) => (a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99);
    const chips = (el, m, set, order) => {
      el.innerHTML = [...m.keys()].sort(sortBy(order)).map((v) =>
        `<button class="chip" aria-pressed="false" data-v="${esc(v)}">${esc(v)}</button>`).join("");
      el.addEventListener("click", (e) => {
        const b = e.target.closest(".chip"); if (!b) return;
        const v = b.dataset.v; set.has(v) ? set.delete(v) : set.add(v);
        b.setAttribute("aria-pressed", set.has(v)); refresh();
      });
    };
    chips($("#fThemes"), count("themes"), state.themes, themeOrder);
    chips($("#fEpochs"), count("epochs"), state.epochs, epochOrder);
    const districts = [...new Set(state.items.map((i) => i.place.stadtteil))].sort((a, b) => a.localeCompare(b, "de"));
    $("#fDistrict").innerHTML = `<option value="">Alle Stadtteile</option>` + districts.map((d) => `<option>${esc(d)}</option>`).join("");
  }
  function passes(i) {
    if (i.importance < state.minImp) return false;
    if (state.district && i.place.stadtteil !== state.district) return false;
    if (state.themes.size && !i.themes.some((t) => state.themes.has(t))) return false;
    if (state.epochs.size && !i.epochs.some((t) => state.epochs.has(t))) return false;
    if (state.q) {
      const hay = `${i.title} ${i.kind} ${i.teaser} ${i.place.stadtteil} ${i.themes.join(" ")} ${i.story.join(" ")}`.toLowerCase();
      if (!state.q.split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    return true;
  }
  function filterSummary() {
    const parts = [...state.themes, ...state.epochs];
    if (state.minImp > 1) parts.push(state.minImp === 3 ? "nur Wahrzeichen" : "Bedeutend+");
    if (state.district) parts.push(state.district);
    $("#filterSummary").textContent = parts.length ? parts.join(", ") : "alle Geschichten";
  }
  function refresh() { filterSummary(); place(); renderList(); }

  // ---------- Marker & zoomabhängige Auswahl ----------
  const measure = document.createElement("canvas").getContext("2d");
  function labelWidth(it) {
    measure.font = it.importance === 3 ? "600 13.5px Literata, Georgia, serif" : "500 12.5px 'Public Sans', system-ui, sans-serif";
    return measure.measureText(it.title).width + 14;
  }
  function createPin(it) {
    const el = document.createElement("div");
    el.className = `pin i${it.importance} off`;
    el.innerHTML = `<button aria-label="${esc(it.title)}"><span class="dot"></span><span class="lbl">${esc(it.title)}</span></button>`;
    el.querySelector("button").addEventListener("click", (e) => { e.stopPropagation(); openDetail(it.id, { fly: false }); });
    el.addEventListener("mouseenter", () => highlightRow(it.id, true));
    el.addEventListener("mouseleave", () => highlightRow(it.id, false));
    it.el = el;
    it.marker = new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat(it.coord).addTo(map);
  }

  // Greedy-Platzierung in Bildschirmkoordinaten: wichtigere (und zufällig gemischte) Geschichten zuerst,
  // was nicht mehr passt, wird ausgeblendet statt zu einer Zahl zusammengefasst.
  function place() {
    if (!map) return;
    const z = map.getZoom();
    const w = map.getContainer().clientWidth, h = map.getContainer().clientHeight;
    const pad = z < 13 ? 22 : 12;
    const boxes = [];
    const hit = (b) => boxes.some((o) => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]);
    const cand = state.items
      .filter((i) => passes(i) && (i.id === state.selected || z >= MIN_ZOOM[i.importance]))
      .map((i) => ({ i, p: map.project(i.coord) }))
      .filter(({ p }) => p.x > -60 && p.y > -30 && p.x < w + 60 && p.y < h + 30)
      .sort((a, b) => (b.i.id === state.selected) - (a.i.id === state.selected) || b.i.importance - a.i.importance || a.i.rand - b.i.rand);
    const shown = new Set(), labeled = new Set();
    let farCount = 0;
    for (const { i, p } of cand) {
      if (z < FAR_ZOOM && i.id !== state.selected && farCount >= FAR_MAX) continue;
      const r = i.importance === 3 ? 9 : 7;
      const dot = [p.x - r - pad, p.y - r - pad, p.x + r + pad, p.y + r + pad];
      const wantLabel = i.id === state.selected || z >= LABEL_ZOOM[i.importance];
      const lbl = [p.x + r, p.y - 12, p.x + r + 6 + labelWidth(i), p.y + 12];
      if (wantLabel && !hit(dot) && !hit(lbl)) {
        boxes.push(dot, lbl); shown.add(i.id); labeled.add(i.id);
      } else if (!hit(dot)) {
        boxes.push(dot); shown.add(i.id);
      } else continue;
      farCount++;
    }
    for (const i of state.items) {
      i.el.classList.toggle("off", !shown.has(i.id));
      i.el.classList.toggle("nolabel", !labeled.has(i.id));
      i.el.classList.toggle("sel", i.id === state.selected);
      i.el.style.zIndex = i.id === state.selected ? 3 : i.importance === 3 ? 2 : 1;
    }
  }

  // ---------- Liste ----------
  function refPoint() { return state.user || map.getCenter().toArray(); }
  function renderList() {
    if (!map || state.selected) return;
    const ref = refPoint();
    const items = state.items.filter(passes).map((i) => ({ i, d: km(ref, i.coord) })).sort((a, b) => a.d - b.d);
    const from = state.user ? "deinem Standort" : "der Kartenmitte";
    $("#listMeta").textContent = items.length
      ? `${items.length} ${items.length === 1 ? "Geschichte" : "Geschichten"}, sortiert nach Entfernung zu ${from}`
      : "";
    $("#list").innerHTML = items.length ? items.map(({ i, d }) => `
      <li><button class="item" data-id="${esc(i.id)}">
        <i class="mk i${i.importance}" title="${IMPORTANCE[i.importance]}"></i>
        <h3>${esc(i.title)}</h3><span class="dist">${fmtDist(d)}</span>
        <p>${esc(i.teaser)}</p>
        <span class="meta">${esc(i.place.stadtteil)} · ${esc(i.period)} · ${esc(i.themes.slice(0, 2).join(", "))}</span>
      </button></li>`).join("")
      : `<li class="empty">Keine Geschichten für diese Filter. <button class="reset" data-reset>Filter zurücksetzen</button></li>`;
  }
  function highlightRow(id, on) {
    const row = document.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
    if (row) row.classList.toggle("hl", on);
  }

  // ---------- Detail ----------
  function openDetail(id, { fly = true } = {}) {
    const it = state.items.find((i) => i.id === id); if (!it) return;
    state.selected = id;
    const d = state.user ? km(state.user, it.coord) : null;
    const osm = `https://www.openstreetmap.org/?mlat=${it.coord[1]}&mlon=${it.coord[0]}#map=18/${it.coord[1]}/${it.coord[0]}`;
    $("#detail").innerHTML = `
      <button class="back" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>Alle Geschichten</button>
      <div class="eyebrow"><i class="mk i${it.importance}"></i>${IMPORTANCE[it.importance]} · ${esc(it.kind)}</div>
      <h2>${esc(it.title)}</h2>
      <div class="facts"><span>${esc(it.address)}</span><span>${esc(it.period)}</span>${d != null ? `<span>${fmtDist(d)} entfernt</span>` : ""}</div>
      <p class="lead">${esc(it.teaser)}</p>
      <div class="story">${it.story.map((p) => `<p>${esc(p)}</p>`).join("")}</div>
      <div class="tags">
        ${it.themes.map((t) => `<button class="tag" data-theme-tag="${esc(t)}" title="Nach ${esc(t)} filtern">${esc(t)}</button>`).join("")}
        ${it.epochs.map((t) => `<button class="tag" data-epoch-tag="${esc(t)}" title="Nach ${esc(t)} filtern">${esc(t)}</button>`).join("")}
        <span class="tag loc">${esc(it.place.stadtteil)}</span>
        <span class="tag loc">${esc(it.place.stadt)}</span>
        <span class="tag loc">${esc(it.place.bundesland)}</span>
      </div>
      <div class="links">
        <a href="${osm}" target="_blank" rel="noopener">Auf OpenStreetMap öffnen</a>
        ${it.sources.map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">Mehr bei ${esc(s.label)}</a>`).join("")}
      </div>`;
    $("#listView").hidden = true; $("#detail").hidden = false; $("#body").scrollTop = 0;
    $("#panel").classList.add("expanded");
    try { history.replaceState(null, "", "#" + id); } catch {}
    if (fly) {
      map.flyTo({ center: it.coord, zoom: Math.max(map.getZoom(), 16), offset: panelOffset(), duration: 900 });
    } else {
      const p = map.project(it.coord), c = map.getContainer();
      const leftEdge = window.innerWidth > 760 ? 400 : 0;
      if (p.x < leftEdge + 30 || p.x > c.clientWidth - 30 || p.y < 30 || p.y > c.clientHeight * (window.innerWidth > 760 ? 1 : 0.5)) {
        map.easeTo({ center: it.coord, offset: panelOffset(), duration: 600 });
      }
    }
    place();
  }
  function closeDetail() {
    state.selected = null;
    $("#detail").hidden = true; $("#listView").hidden = false;
    try { history.replaceState(null, "", location.pathname + location.search); } catch {}
    place(); renderList();
  }
  function panelOffset() {
    return window.innerWidth > 760 ? [(16 + 384) / 2, 0] : [0, -window.innerHeight * 0.25];
  }

  // ---------- In meiner Nähe ----------
  let meMarker;
  function locate() {
    const btn = $("#nearBtn");
    if (!navigator.geolocation) { toast("Dein Browser gibt keinen Standort frei."); return; }
    btn.classList.add("busy");
    navigator.geolocation.getCurrentPosition((pos) => {
      btn.classList.remove("busy");
      const here = [pos.coords.longitude, pos.coords.latitude];
      state.user = here;
      if (!meMarker) { const el = document.createElement("div"); el.className = "me"; meMarker = new maplibregl.Marker({ element: el }); }
      meMarker.setLngLat(here).addTo(map);
      const dist = km(here, CITY.center);
      if (dist > CITY.radiusKm) {
        toast(`Du bist etwa ${Math.round(dist)} km von Frankfurt entfernt. Bisher gibt es nur Geschichten aus Frankfurt, sie sind nach Entfernung zu dir sortiert.`);
        map.flyTo({ center: CITY.center, zoom: 13.2, offset: panelOffset() });
      } else {
        map.flyTo({ center: here, zoom: 16, offset: panelOffset() });
        const near = state.items.filter(passes).map((i) => km(here, i.coord)).filter((d) => d < 0.5).length;
        toast(near ? `${near} ${near === 1 ? "Geschichte" : "Geschichten"} im Umkreis von 500 m.` : "In 500 m Umkreis gibt es noch keine Geschichten. Die Liste zeigt die nächsten.");
      }
      if (!state.selected) renderList();
    }, (err) => {
      btn.classList.remove("busy");
      toast(err.code === 1 ? "Standortzugriff wurde abgelehnt. Du kannst ihn in den Browser-Einstellungen erlauben." : "Dein Standort konnte gerade nicht ermittelt werden.");
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  }

  // ---------- UI-Verdrahtung ----------
  function wireUi() {
    $("#themeBtn").addEventListener("click", () => {
      theme = theme === "dark" ? "light" : "dark";
      store.set("lore-theme", theme); applyTheme();
      map.setStyle(STYLES[theme]);
    });
    $("#q").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); if (state.selected) closeDetail(); refresh(); });
    $("#filterToggle").addEventListener("click", (e) => {
      const open = $("#filters").hidden; $("#filters").hidden = !open;
      e.currentTarget.setAttribute("aria-expanded", open);
      if (open) $("#panel").classList.add("expanded");
    });
    $("#fImp").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      state.minImp = +b.dataset.v;
      $("#fImp").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
      refresh();
    });
    $("#fDistrict").addEventListener("change", (e) => {
      state.district = e.target.value; refresh();
      if (state.district) {
        const pts = state.items.filter((i) => i.place.stadtteil === state.district).map((i) => i.coord);
        const b = pts.reduce((bb, c) => bb.extend(c), new maplibregl.LngLatBounds(pts[0], pts[0]));
        map.fitBounds(b, { padding: { top: 80, bottom: 80, left: window.innerWidth > 760 ? 440 : 40, right: 80 }, maxZoom: 16 });
      }
    });
    const resetAll = () => {
      state.themes.clear(); state.epochs.clear(); state.minImp = 1; state.district = ""; state.q = "";
      $("#q").value = ""; $("#fDistrict").value = "";
      document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
      $("#fImp").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x.dataset.v === "1"));
      refresh();
    };
    $("#reset").addEventListener("click", resetAll);
    $("#list").addEventListener("click", (e) => {
      if (e.target.closest("[data-reset]")) return resetAll();
      const b = e.target.closest(".item"); if (b) openDetail(b.dataset.id, { fly: true });
    });
    $("#list").addEventListener("mouseover", (e) => {
      const b = e.target.closest(".item");
      state.items.forEach((i) => i.el.querySelector(".dot").style.transform = b && i.id === b.dataset.id ? "translate(-50%,-50%) scale(1.35)" : "");
    });
    $("#list").addEventListener("mouseleave", () => state.items.forEach((i) => i.el.querySelector(".dot").style.transform = ""));
    $("#detail").addEventListener("click", (e) => {
      if (e.target.closest("#back")) return closeDetail();
      const t = e.target.closest("[data-theme-tag],[data-epoch-tag]"); if (!t) return;
      const set = t.dataset.themeTag ? state.themes : state.epochs, v = t.dataset.themeTag || t.dataset.epochTag;
      set.add(v);
      document.querySelectorAll(`.chip[data-v="${CSS.escape(v)}"]`).forEach((c) => c.setAttribute("aria-pressed", "true"));
      closeDetail(); refresh();
      toast(`Gefiltert nach „${v}“.`);
    });
    $("#nearBtn").addEventListener("click", locate);
    $("#shuffleBtn").addEventListener("click", () => {
      state.items.forEach((i) => (i.rand = Math.random()));
      place();
      toast(map.getZoom() < 14 ? "Neue Auswahl. Zoom hinein, um mehr zu sehen." : "Neue Auswahl.");
    });
    $("#zin").addEventListener("click", () => map.zoomIn());
    $("#zout").addEventListener("click", () => map.zoomOut());
    $("#handle").addEventListener("click", () => $("#panel").classList.toggle("expanded"));
    map.on("click", () => { if (window.innerWidth <= 760) $("#panel").classList.remove("expanded"); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.selected) closeDetail(); });
  }
})();
</script>
</body>
</html>
